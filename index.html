<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily Brief">
<title>Daily Brief</title>
<meta name="description" content="The news, explained in minutes. Verified sources, one-minute summaries, context and a daily quiz.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F4F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0F12" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<meta property="og:title" content="Daily Brief">
<meta property="og:description" content="The news, explained in minutes.">
<meta property="og:image" content="icons/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  /* Daily Brief: Apple-minimal news reader. One phone-width column, sticky header, bottom tabs, full-screen story sheet, chat drawer. */
  --bg:#F4F5F7;
  --surface:#FFFFFF;
  --ink:#101114;
  --muted:#5F6672;
  --line:#E3E6EC;
  --chip:#E9EBEF;
  --accent:#2E4FD8;
  --accent-soft:#E9EDFC;
  --live:#D61F35; --live-ink:#FFFFFF;
  --bar:#101114; --bar-ink:rgba(255,255,255,.78); --bar-on:#FFFFFF; --bar-on-ink:#101114;
  --good:#1D7A4C; --good-soft:#E4F2EA;
  --warn:#946000; --warn-soft:#FAF0DC;
  --bad:#B42F25;
  --left:#2E5FBF; --right:#B5432C;
  /* Topic colours: white text sits on each of them (4.5:1 or better) */
  --t-Geopolitics:#2E4FD8; --t-Politics:#7A3FD1; --t-Economy:#0B7A86; --t-Markets:#C2410C; --t-Energy:#9A6700; --t-Climate:#0B7A54;
  --display:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;
  --body:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --radius:22px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E0F12; --surface:#17191D; --ink:#F2F3F5; --muted:#9AA1AD; --line:#2A2D33; --chip:#23262B;
    --accent:#8DA0FF; --accent-soft:#1D2340; --live:#FF5468; --live-ink:#0E0F12;
    --bar:#23262B; --bar-ink:rgba(242,243,245,.75); --bar-on:#F2F3F5; --bar-on-ink:#0E0F12;
    --good:#55C891; --good-soft:#152A20; --warn:#E9B24E; --warn-soft:#30260F; --bad:#FF7B70;
    --left:#86A9FF; --right:#FF8E74;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E0F12; --surface:#17191D; --ink:#F2F3F5; --muted:#9AA1AD; --line:#2A2D33; --chip:#23262B;
  --accent:#8DA0FF; --accent-soft:#1D2340; --live:#FF5468; --live-ink:#0E0F12;
  --bar:#23262B; --bar-ink:rgba(242,243,245,.75); --bar-on:#F2F3F5; --bar-on-ink:#0E0F12;
  --good:#55C891; --good-soft:#152A20; --warn:#E9B24E; --warn-soft:#30260F; --bad:#FF7B70;
  --left:#86A9FF; --right:#FF8E74;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none !important}

.app{max-width:560px;margin:0 auto;min-height:100%;position:relative}
.top{position:sticky;top:0;z-index:5;background:var(--bg);background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);padding:calc(env(safe-area-inset-top) + 14px) 20px 8px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{display:grid;grid-template-columns:repeat(2,11.5px);gap:3px;flex:none}
.logo i{height:11.5px;border-radius:4px}
.logo i:nth-child(1){background:var(--t-Geopolitics)}.logo i:nth-child(2){background:var(--t-Markets)}.logo i:nth-child(3){background:var(--t-Climate)}.logo i:nth-child(4){background:var(--t-Politics)}
.dateline{color:var(--muted);font-size:12.5px;font-weight:600;display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right;flex:none}
.dl-upd{display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.dl-upd i{width:6px;height:6px;border-radius:50%;background:var(--good)}
.wordmark{font-family:var(--display);font-weight:800;font-size:27px;letter-spacing:-.03em;line-height:1.1;margin:0}
.sub{color:var(--muted);font-size:14px;margin:2px 0 0}
.pill-tr{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:var(--chip);border-radius:999px;padding:2px 9px;margin-left:4px;color:var(--ink)}
.spin{width:11px;height:11px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);display:inline-block;animation:spin .8s linear infinite;vertical-align:-1px;margin-right:6px}
.pill-tr .spin{margin-right:0}
@keyframes spin{to{transform:rotate(360deg)}}
.modes{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.modes::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;white-space:nowrap;cursor:pointer}
.chip.sm{padding:5px 11px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

main{padding:4px 20px calc(110px + env(safe-area-inset-bottom))}
.proto{font-size:12.5px;color:var(--muted);background:var(--chip);border-radius:10px;padding:8px 12px;margin:8px 0 0}
.section-title{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:26px 0 10px}
.st-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.st-row .link-btn{font-size:14px;padding:0}
.list{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;display:grid;gap:6px;transition:transform .15s}
.card:active{transform:scale(.99)}
.card-top,.card-foot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.kicker{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.meta{color:var(--muted);font-size:13px}
.headline{font-family:var(--display);font-weight:600;font-size:20px;line-height:1.22;margin:0;text-wrap:balance}
.headline.sm{font-size:17px}
.top-card .headline{font-size:23px}
.summary{color:var(--muted);font-size:15px;margin:0}
.badge,.fol-badge{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--good)}
.fol-badge{color:var(--accent)}
.wl{display:grid;gap:10px}
.wl-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px}
.wl-top{display:flex;justify-content:space-between;align-items:baseline}
.wl-top b{font-size:16px}
.wl-hit{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:9px 0 3px;margin-top:8px;cursor:pointer;font-size:14.5px}
.wl-hit .dir{min-width:18px;font-size:15px}

.tabs{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 40px);max-width:520px;height:64px;display:flex;align-items:center;justify-content:space-between;background:var(--bar);border-radius:32px;padding:7px;z-index:6;box-shadow:0 10px 30px rgba(16,17,20,.18)}
.tab{position:relative;background:none;border:0;color:var(--bar-ink);height:50px;min-width:50px;border-radius:25px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 13px;cursor:pointer;font-size:14.5px;font-weight:700}
.tab:not([aria-current]) span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tab[aria-current="page"]{background:var(--bar-on);color:var(--bar-on-ink);padding:0 18px}

/* Story sheet */
.sheet{position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}
.sheet.open{display:block}
.sheet-bar{position:sticky;top:0;z-index:2;background:var(--bg);background:color-mix(in srgb,var(--bg) 94%,transparent);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);padding:calc(env(safe-area-inset-top) + 8px) 0 4px}
.sheet-bar-inner{max-width:560px;margin:0 auto;padding:0 20px}
.back{background:none;border:0;color:var(--accent);font-weight:600;font-size:16px;padding:6px 0;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.sheet-inner{max-width:560px;margin:0 auto;padding:6px 20px calc(110px + env(safe-area-inset-bottom))}
.s-head{font-family:var(--display);font-weight:600;font-size:30px;line-height:1.14;letter-spacing:-.01em;margin:8px 0 8px;text-wrap:balance}
.s-meta-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.follow{border:1.5px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.follow[aria-pressed="true"]{background:var(--accent);color:#fff}
.tr-bar{margin-top:10px;font-size:13.5px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--chip);border-radius:10px;padding:8px 12px}
.lede{font-size:18px;line-height:1.45;margin:14px 0 0}
details.verify{margin-top:10px;background:var(--good-soft);border-radius:12px;padding:9px 12px}
details.verify summary{cursor:pointer;color:var(--good);font-weight:700;font-size:14px;list-style:none;display:flex;align-items:center;gap:6px}
details.verify summary::-webkit-details-marker{display:none}
details.verify p{margin:8px 0 2px;font-size:14px}
.blk{margin-top:28px}
.blk h3{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag-a{font-size:11px;letter-spacing:.04em;background:var(--warn-soft);color:var(--warn);border-radius:999px;padding:2px 8px;text-transform:none;font-weight:700}
.facts{margin:0;padding-left:20px}
.facts li{margin:7px 0}
.facts li::marker{color:var(--muted)}
sup.ref{font-size:11px;font-weight:700;margin-left:2px}
sup.ref a{color:var(--accent);text-decoration:none}
.chain{list-style:none;margin:0;padding:0}
.chain li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.chain li + li{margin-top:22px;position:relative}
.chain li + li::before{content:"";position:absolute;left:50%;top:-18px;width:2px;height:14px;background:var(--muted);opacity:.5}
.tl{border-left:2px solid var(--line);margin-left:5px;padding-left:18px}
.tl-item{position:relative;padding-bottom:14px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:-25px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--muted)}
.tl-item:last-child::before{background:var(--accent);border-color:var(--accent)}
.tl-date{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.tl-item p{margin:2px 0 0}
.pattern{margin-top:14px;background:var(--accent-soft);border-radius:12px;padding:12px 14px}
.pattern b{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.pv-intro{font-size:14px;color:var(--muted);margin:0 0 10px}
.pv{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.pv-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pv-head b,.pv-name{font-size:15px;font-weight:700}
.pv-outlet{font-size:13px;color:var(--muted);font-weight:600}
.pv-desc{font-size:12.5px;color:var(--muted);margin-top:1px}
.pv p{margin:6px 0 0}
.lean{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.lean.left,.lean.leanLeft{background:color-mix(in srgb,var(--left) 15%,transparent);color:var(--left)}
.lean.center{background:var(--chip);color:var(--muted)}
.lean.leanRight,.lean.right{background:color-mix(in srgb,var(--right) 15%,transparent);color:var(--right)}
.lean.state{background:var(--warn-soft);color:var(--warn)}
.conn{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer}
.conn.static{cursor:default}
.conn .go{color:var(--accent);font-weight:700;flex:none}
.stack{display:grid;gap:8px}
.scn{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:5px}
.scn-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700}
.pill{border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700}
.pill.l1{background:var(--good-soft);color:var(--good)}
.pill.l2{background:var(--warn-soft);color:var(--warn)}
.pill.l3{background:var(--chip);color:var(--muted)}
.scn p{margin:0}
.scn .mk{font-size:14px;color:var(--muted)}
.scn .mk b{color:var(--ink)}
.imp{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.imp-l{display:grid}
.imp-l span{font-size:13.5px;color:var(--muted)}
.dir{font-weight:800;font-size:15px;white-space:nowrap}
.dir.up{color:var(--good)} .dir.down{color:var(--bad)} .dir.mixed{color:var(--warn)}
.note{font-size:13px;color:var(--muted);margin:10px 0 0}
dl.terms{margin:0;display:grid;gap:10px}
dl.terms div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
dl.terms dt{font-weight:700}
dl.terms dd{margin:2px 0 0;color:var(--muted)}
.more-btn{display:inline-flex;align-items:center;gap:6px}
.more-btn .chev,.src-pill .chev{transition:transform .2s}
.more-btn[aria-expanded="true"] .chev,.src-pill[aria-expanded="true"] .chev{transform:rotate(180deg)}
.src-pill{display:inline-flex;align-items:center;gap:10px;background:var(--chip);border:0;border-radius:999px;padding:5px 14px 5px 5px;color:var(--ink);font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;transition:background .15s}
.src-pill:hover{background:var(--line)}
.src-pill .chev{color:var(--muted)}
.src-av{display:flex}
.src-av i{width:28px;height:28px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 2px var(--chip);display:grid;place-items:center;font-style:normal;font-size:9.5px;font-weight:800;letter-spacing:-.02em;color:var(--ink);margin-left:-7px;position:relative}
.src-av i:first-child{margin-left:0;z-index:3}.src-av i:nth-child(2){z-index:2}
.src-wrap{margin-top:16px}
.src-list{margin-top:14px}
ol.src{margin:0;padding-left:22px;font-size:14.5px}
ol.src li{margin:10px 0;scroll-margin-top:90px}
ol.src .src-head{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
ol.src a{color:var(--ink);text-decoration-color:var(--line);text-underline-offset:3px}
ol.src .pub{font-weight:700}
.tier{font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--chip);color:var(--muted);white-space:nowrap}
.tier.agency,.tier.official{background:var(--good-soft);color:var(--good)}
.tier.intl{background:color-mix(in srgb,var(--left) 12%,transparent);color:var(--left)}
.tier.state{background:var(--warn-soft);color:var(--warn)}
.tier.pay{color:var(--ink)}
.link-btn{background:none;border:0;color:var(--accent);font-weight:600;padding:6px 0;cursor:pointer;font-size:15px}
.link-btn.sm{font-size:13.5px;padding:0}
.report textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);color:var(--ink);font:15px var(--body);margin-top:8px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.soft{background:var(--chip)}
.ask-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:11;width:calc(100% - 40px);max-width:520px}
.ask-btn{width:100%;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:15px 18px;font-weight:700;font-size:16px;box-shadow:0 8px 24px rgba(196,18,47,.28);cursor:pointer;display:flex;justify-content:center;align-items:center;gap:8px}

/* Chat */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:15;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:100%;max-width:560px;height:80%;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.2);z-index:20;display:flex;flex-direction:column;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.drawer.open{transform:translate(-50%,0)}
.drawer-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 18px 10px;border-bottom:1px solid var(--line)}
.drawer-head h2{font-family:var(--display);font-size:20px;margin:0;line-height:1.2}
.drawer-head p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.x{background:var(--chip);border:0;border-radius:999px;width:32px;height:32px;cursor:pointer;flex:none;font-size:18px;line-height:1}
.chatbox{flex:1;display:flex;flex-direction:column;min-height:0}
.msgs{flex:1;overflow-y:auto;padding:14px 16px}
.msg{max-width:88%;padding:10px 13px;border-radius:18px;margin:6px 0;font-size:15.5px}
.msg p{margin:0 0 6px}.msg p:last-child{margin:0}
.msg ul{margin:4px 0;padding-left:18px}
.msg.user{margin-left:auto;background:var(--accent);color:#fff;border-bottom-right-radius:6px}
.msg.ai{background:var(--chip);border-bottom-left-radius:6px}
.msg.pending{color:var(--muted);font-style:italic}
.sugg{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 8px;scrollbar-width:none}
.sugg::-webkit-scrollbar{display:none}
.chat-form{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.chat-form input{flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;padding:11px 15px;background:var(--bg);color:var(--ink);font:16px var(--body)}
.send{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:0 18px;font-weight:700;cursor:pointer}
.ask-page{display:flex;flex-direction:column;height:calc(100dvh - 200px);min-height:420px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-top:12px}
.ask-page .chat-form{padding-bottom:10px}

/* Quiz */
.qz{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-top:12px}
.qz-hero{display:grid;gap:6px;justify-items:start}
.qz-title{font-family:var(--display);font-size:28px;font-weight:600;margin:4px 0 0;line-height:1.1}
.qz-bar{height:6px;background:var(--chip);border-radius:6px;overflow:hidden;margin:8px 0 16px}
.qz-bar span{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .35s}
.qz-q{font-family:var(--display);font-size:22px;line-height:1.25;margin:0 0 16px;font-weight:600;text-wrap:balance}
.qz-opts{display:grid;gap:8px}
.qz-opt{text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:13px 15px;font-size:16px;cursor:pointer;transition:transform .1s}
.qz-opt:not(:disabled):active{transform:scale(.99)}
.qz-opt:disabled{cursor:default;opacity:.65}
.qz-opt.ok{border-color:var(--good);background:var(--good-soft);opacity:1;font-weight:600}
.qz-opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent);opacity:1}
.qz-fb{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--chip);display:grid;gap:6px}
.qz-fb.good b{color:var(--good)} .qz-fb.badfb b{color:var(--bad)}
.qz-big{font-family:var(--display);font-size:72px;font-weight:600;line-height:1;margin:6px 0 10px;font-variant-numeric:tabular-nums}
.qz-of{font-size:32px;color:var(--muted)}
.qz-streak{display:inline-flex;gap:6px;align-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:999px;padding:5px 12px;font-size:14px}

/* Onboarding */
.onb{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 22px) 22px calc(22px + env(safe-area-inset-bottom))}
.lang-row{display:flex;gap:6px;flex-wrap:wrap}
.dots{display:flex;gap:6px;margin-bottom:28px}
.dots span{height:4px;flex:1;border-radius:4px;background:var(--line)}
.dots span.on{background:var(--accent)}
.onb h1{font-family:var(--display);font-weight:600;font-size:30px;line-height:1.15;margin:0 0 6px;text-wrap:balance}
.onb .lead{color:var(--muted);margin:0 0 22px}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;display:grid;gap:2px}
.opt b{font-size:16px}
.opt span{font-size:14px;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.onb-foot{margin-top:auto;padding-top:24px;display:grid;gap:10px}
.primary{background:var(--ink);color:var(--bg);border:0;border-radius:14px;padding:16px;font-weight:700;font-size:16px;cursor:pointer;width:100%}
.primary:disabled{opacity:.35;cursor:not-allowed}
.ghost{background:none;border:0;color:var(--muted);font-weight:600;padding:8px;cursor:pointer}
.hero-mark{font-family:var(--display);font-weight:600;font-size:46px;letter-spacing:-.02em;line-height:1;margin:34px 0 10px}
.hero-mark i{color:var(--accent);font-style:normal}
.promise{display:grid;gap:14px;margin:28px 0 0;padding:0;list-style:none}
.promise li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.promise .n{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:13px}
.promise b{display:block}
.promise span{color:var(--muted);font-size:14.5px}

/* Settings */
.set-group{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;scroll-margin-top:150px}
.set-group + .set-group{margin-top:12px}
.set-group h3{margin:0 0 10px;font-size:15px}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.row p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.switch{width:51px;height:31px;border-radius:999px;border:0;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.switch[aria-checked="true"]{background:var(--good)}
.switch[aria-checked="true"]::after{left:22px}
.about{font-size:14.5px;color:var(--muted)}
.about p{margin:0 0 8px}

/* Notification */
.notif{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translate(-50%,-160%);width:calc(100% - 24px);max-width:536px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 34px rgba(0,0,0,.18);padding:12px 14px;z-index:40;transition:transform .35s cubic-bezier(.2,.8,.2,1);cursor:pointer;text-align:left}
.notif.show{transform:translate(-50%,0)}
.notif-top{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:600}
.notif-top em{font-style:normal;background:var(--chip);border-radius:999px;padding:0 7px}
.notif b{display:block;margin-top:3px;font-size:15px}

@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}

/* Context view: News / Context switch, who's who, background timeline */
.seg{display:flex;background:var(--chip);border-radius:11px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:600;font-size:14.5px;color:var(--muted);cursor:pointer}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.sm{flex:none}
.seg.sm button{flex:none;padding:5px 11px;font-size:13px}
.view-tabs{margin-top:16px}
.ctx-hint{display:flex;justify-content:space-between;gap:12px;align-items:center;width:100%;text-align:left;margin-top:16px;background:var(--accent-soft);border:0;border-radius:12px;padding:12px 14px;cursor:pointer;color:var(--ink);font-size:14.5px;line-height:1.35}
.ctx-hint b{color:var(--accent);white-space:nowrap;font-size:14px}
.who{display:grid;gap:8px}
.who-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:grid;gap:2px}
.who-card span{color:var(--muted);font-size:14.5px}
.ctl-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.ctl-head h3{margin:0}
.ctl{list-style:none;margin:0;padding:0 0 0 24px;position:relative}
.ctl::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--line)}
.ctl-item{position:relative;padding:0 0 20px}
.ctl-item:last-child{padding-bottom:0}
.ctl-item::before{content:"";position:absolute;left:-23px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--muted)}
.ctl-item.key::before{background:var(--accent);border-color:var(--accent)}
.ctl-item.now::before{left:-25px;top:3px;width:14px;height:14px;background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.ctl-item.after::before{background:var(--good);border-color:var(--good)}
.ctl-item.next::before{background:var(--bg);border:2px dashed var(--muted)}
.ctl-item.now > p:first-of-type{font-weight:600}
.ctl-item.next > p{color:var(--muted)}
.ctl-date{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctl-tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 8px}
.ctl-tag.key{background:var(--accent-soft);color:var(--accent)}
.ctl-tag.now{background:var(--accent);color:#fff}
.ctl-tag.after{background:var(--good-soft);color:var(--good)}
.ctl-tag.next{background:var(--chip);color:var(--muted)}
.ctl-item p{margin:3px 0 0}
.ctl-why{color:var(--muted);font-size:14.5px}
.ctl-link{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13.5px;cursor:pointer;color:var(--ink)}
.ctl-link .go{color:var(--accent);font-weight:700;flex:none}
.ctx-actions{display:flex;gap:16px;align-items:center;flex-wrap:wrap}

/* Home filters: topics and regions */
.filters .modes.regions{padding-top:8px}
.empty{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 16px;text-align:center}
.empty p{color:var(--muted);font-size:14.5px;margin:6px 0 4px}
.rec{display:inline-block;vertical-align:2px;margin-left:6px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--good);background:var(--good-soft);border-radius:999px;padding:2px 8px}

/* Unread updates on followed stories */
.tab{position:relative}
.tab-badge{position:absolute;top:0;right:0;min-width:19px;height:19px;border-radius:10px;background:var(--live);color:var(--live-ink);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid var(--bar)}
.live{display:inline-flex;align-items:center;gap:5px;flex:none;background:var(--live);color:var(--live-ink);font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;border-radius:6px;padding:3px 7px 2px;line-height:1.2}
.live i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:livePulse 1.4s ease-in-out infinite}
@keyframes livePulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.live i{animation:none}}
.k-left{display:inline-flex;align-items:center;gap:7px;min-width:0}
.card-top .meta{white-space:nowrap}
.card-top .kicker{letter-spacing:.045em}
.card-top .live{padding:3px 6px 2px;gap:4px}
.k-reg{white-space:nowrap}
.k-reg{color:var(--muted)}
.kicker-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.upd-line{display:flex;align-items:center;gap:6px;margin:10px 0 0;font-size:14px;font-weight:600;color:var(--ink)}
.upd-line svg{color:var(--accent)}
.unread{flex:none;min-width:22px;height:22px;border-radius:11px;background:var(--live);color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.upd{margin-top:16px;border:1.5px solid var(--accent);background:var(--surface);border-radius:var(--radius);padding:14px 16px}
.upd-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.upd-head b{flex:1}
.udot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.upd .ctl::before{top:6px}
.upd-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}

/* ---------- Home: Color design ---------- */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 12px}
.sec-title{font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:0}
.frow{display:flex;gap:8px;overflow-x:auto;padding:14px 20px 2px;margin:0 -20px;scrollbar-width:none}
.frow::-webkit-scrollbar{display:none}
.fchip{flex:none;height:40px;border-radius:999px;border:0;background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;padding:0 16px;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.fchip .dot{width:10px;height:10px;border-radius:50%;background:var(--tc)}
.fsel{position:relative;flex:none;display:inline-flex}
.fsel select{appearance:none;-webkit-appearance:none;height:40px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:14px;font-weight:600;padding:0 34px 0 38px;cursor:pointer}
.fsel.on select{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fsel svg{position:absolute;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--ink)}
.fsel.on svg{color:var(--bg)}
.fsel .g{left:14px}.fsel .c{right:13px}
.tiles{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px;padding:0 20px;scroll-padding:0 20px;scrollbar-width:none}
.tiles::-webkit-scrollbar{display:none}
.tile{flex:none;width:min(300px,80vw);min-height:392px;border-radius:30px;padding:14px;background:var(--tc);color:#fff;display:flex;flex-direction:column;gap:14px;scroll-snap-align:start;cursor:pointer;transition:transform .15s}
.tile:active,.sq:active,.fol-card:active{transform:scale(.985)}
.tile-pic{position:relative;height:170px;border-radius:20px;background:rgba(0,0,0,.2);color:rgba(255,255,255,.62);display:grid;place-items:center;flex:none}
.tile-pic .live{position:absolute;top:10px;left:10px}
.tile-body{display:flex;flex-direction:column;gap:8px;padding:0 6px;flex:1}
.tile-k{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.9)}
.tile-h{font-family:var(--display);font-size:27px;line-height:1.05;font-weight:800;letter-spacing:-.03em;margin:0;text-wrap:balance}
.tile-foot{padding:0 6px 4px;display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:600;color:rgba(255,255,255,.9)}
.tile-foot span{display:inline-flex;align-items:center;gap:5px}
.tile .live,.sq .live{background:#FFFFFF;color:var(--tc)}
.tile .live i,.sq .live i{background:#D61F35}
.dots{display:flex;justify-content:center;gap:6px;margin-top:14px}
.dots i{width:6px;height:6px;border-radius:999px;background:var(--line);transition:width .2s,background .2s}
.dots i.on{width:22px;background:var(--tc)}
.fol{display:grid;gap:10px}
.fol-card{--tc-t:var(--tc);background:var(--surface);border-radius:22px;padding:14px;display:grid;gap:10px;cursor:pointer;transition:transform .15s}
.fol-head{display:flex;align-items:center;gap:10px}
.fol-ic{width:38px;height:38px;border-radius:50%;background:var(--tc);color:#fff;display:grid;place-items:center;flex:none}
.fol-card.quiet .fol-ic{background:var(--chip);color:var(--tc-t)}
.fol-t{flex:1;min-width:0;display:grid;gap:5px}
.fol-ev{font-size:16.5px;font-weight:700;line-height:1.25}
.fol-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fol-head .go{color:var(--muted);flex:none}
.fol-new{flex:none;height:22px;padding:0 9px;border-radius:999px;background:var(--tc);color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;white-space:nowrap}
.fol-ok{flex:none;font-size:12.5px;font-weight:600;color:var(--muted)}
.fol-bub{margin-left:48px;justify-self:start;display:grid;gap:2px;padding:9px 13px 10px;border-radius:18px 18px 18px 6px;background:color-mix(in srgb,var(--tc) 12%,var(--surface));font-size:14px;line-height:1.38}
.fol-bub b{font-size:11.5px;font-weight:700;color:var(--tc-t)}
.fol-bub span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sq-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sq{min-height:calc((min(100vw,560px) - 50px) / 2);border-radius:24px;padding:14px;background:var(--tc);color:#fff;display:flex;flex-direction:column;justify-content:space-between;gap:8px;cursor:pointer;min-width:0;transition:transform .15s}
.sq.wide{grid-column:1/-1;min-height:150px}
.sq-top{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.9);min-height:20px}
.sq-h{font-family:var(--display);font-size:19px;line-height:1.08;font-weight:800;letter-spacing:-.02em;margin:0;overflow-wrap:break-word}
.sq-foot{font-size:12px;font-weight:600;color:rgba(255,255,255,.9)}
.sq .live{padding:2px 6px;font-size:9.5px;gap:4px}
.cal{display:grid;gap:10px}
.cal-row{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;border-radius:18px;background:var(--surface);font-size:15px;font-weight:600}
.cal-row b{height:32px;padding:0 10px;border-radius:10px;background:var(--tc);color:#fff;font-size:13px;font-weight:700;display:inline-flex;align-items:center;flex:none;white-space:nowrap;font-variant-numeric:tabular-nums}
.kicker-row .kicker{color:var(--tc,var(--accent))}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .fol-card{--tc-t:color-mix(in srgb,var(--tc) 50%,#fff)}
  :root:not([data-theme="light"]) .kicker-row .kicker{color:color-mix(in srgb,var(--tc,var(--accent)) 50%,#fff)}
  :root:not([data-theme="light"]) .tabs{box-shadow:0 0 0 1px var(--line),0 10px 30px rgba(0,0,0,.4)}
}
:root[data-theme="dark"] .fol-card{--tc-t:color-mix(in srgb,var(--tc) 50%,#fff)}
:root[data-theme="dark"] .kicker-row .kicker{color:color-mix(in srgb,var(--tc,var(--accent)) 50%,#fff)}
:root[data-theme="dark"] .tabs{box-shadow:0 0 0 1px var(--line),0 10px 30px rgba(0,0,0,.4)}

/* ---------- Live newsroom (v5) ---------- */
.tile-pic{overflow:hidden}
.tile-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero{margin:14px 0 0}
.hero img{display:block;width:100%;max-height:300px;object-fit:cover;border-radius:18px;background:var(--chip)}
.hero figcaption{font-size:12px;color:var(--muted);margin-top:6px}
.pic-tools{margin-top:12px;font-size:14px}
.pic-tools summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:13.5px}
.pic-tools input[type=file]{display:block;margin:10px 0;max-width:100%;font:inherit;font-size:14px}
.pic-tools input[type=text]{display:block;width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px;padding:10px 12px}
.pic-row{display:flex;align-items:center;gap:16px;margin-top:10px}
.nr-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:14.5px}
.nr-row span{color:var(--muted)}
.nr-row b{text-align:right;font-weight:600}
.nr-note{margin:10px 0 0;font-size:14.5px}
.nr-state{margin:0 0 10px;font-size:14px;color:var(--warn);font-weight:600}
.set-group.nr h4{margin:16px 0 4px;font-size:14px}
.set-group.nr .facts{font-size:14.5px}
.corr{background:var(--warn-soft);border-radius:14px;padding:12px 14px}
.corr h3{margin-top:0}

/* ---------- Standalone phone app ---------- */
.inst{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--accent-soft);border-radius:18px;padding:12px 14px;margin-top:14px}
.inst div{display:grid;gap:2px;font-size:14px;min-width:0}
.inst b{font-size:15px}
.inst .x{background:var(--surface)}
.sa .sheet-inner{padding-bottom:calc(48px + env(safe-area-inset-bottom))}
.sa .tabs{justify-content:space-around}
</style>
