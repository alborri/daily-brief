const TM_PACK = {"fr":{"2":"2","4":"4","7":"7","12":"12","1995":"1995","1997":"1997","2015":"2015","2018":"2018","2024":"2024","2025":"2025","2026":"2026","Ukraine–Russia talks in Abu Dhabi end with a prisoner swap deal, but big gaps remain":"Les pourparlers Ukraine–Russie d’Abou Dhabi s’achèvent sur un accord d’échange de prisonniers, mais de profonds désaccords demeurent","The first three-way talks with the US since February focused on security guarantees. The only concrete result is a new prisoner exchange.":"Les premiers pourparlers à trois avec les États-Unis depuis février ont porté sur les garanties de sécurité. Le seul résultat concret est un nouvel échange de prisonniers.","These are the first real peace talks in nine months. What is agreed on security guarantees will shape Europe’s security for years, and every sign of progress or failure moves energy and defence markets.":"Ce sont les premiers vrais pourparlers de paix depuis neuf mois. Ce qui sera décidé sur les garanties de sécurité pèsera sur la sécurité de l’Europe pendant des années, et chaque signe de progrès ou d’échec fait bouger les marchés de l’énergie et de la défense.","The war is in its fifth year. Russia occupies about a fifth of Ukraine.":"La guerre est dans sa cinquième année. La Russie occupe environ un cinquième de l’Ukraine.","Earlier US-brokered rounds this year, in Abu Dhabi and Geneva, ended without a breakthrough.":"Les précédentes sessions organisées cette année par les États-Unis, à Abou Dhabi et à Genève, se sont terminées sans percée.","Talks were paused in February, when the US–Israeli war with Iran began.":"Les pourparlers ont été suspendus en février, au début de la guerre des États-Unis et d’Israël contre l’Iran.","The core dispute: Russia demands that Ukraine withdraw from the parts of Donbas it still controls. Kyiv refuses.":"Le cœur du différend : la Russie exige que l’Ukraine se retire des parties du Donbass qu’elle contrôle encore. Kiev refuse.","The US, Russia and Ukraine met in Abu Dhabi on 10–11 November, their first three-way talks since February.":"Les États-Unis, la Russie et l’Ukraine se sont réunis à Abou Dhabi les 10 et 11 novembre, pour leurs premiers pourparlers à trois depuis février.","Delegations were led by Steve Witkoff and Jared Kushner for the US, Kremlin aide Vladimir Medinsky for Russia, and Rustem Umerov for Ukraine.":"Les délégations étaient conduites par Steve Witkoff et Jared Kushner pour les États-Unis, par le conseiller du Kremlin Vladimir Medinski pour la Russie et par Roustem Oumerov pour l’Ukraine.","Talks focused on security guarantees for Ukraine and Europe, Russia’s own security demands, de-escalation and prisoners.":"Les discussions ont porté sur les garanties de sécurité pour l’Ukraine et l’Europe, sur les exigences de sécurité de la Russie, sur la désescalade et sur les prisonniers.","Main result: agreement on a prisoner exchange. Ukraine’s negotiator says significant differences remain.":"Principal résultat : un accord sur un échange de prisonniers. Le négociateur ukrainien dit que des divergences importantes subsistent.","European representatives met Ukraine’s team separately. Europe’s role in future talks is still unresolved.":"Des représentants européens ont rencontré l’équipe ukrainienne à part. Le rôle de l’Europe dans les prochains pourparlers n’est toujours pas réglé.","Security guarantees are discussed before territory":"Les garanties de sécurité sont discutées avant les territoires","Russia can make Ukraine’s protection depend on concessions in Donbas":"La Russie peut faire dépendre la protection de l’Ukraine de concessions dans le Donbass","Europe pushes for a seat, because the guarantees also cover its own security":"L’Europe réclame une place à la table, car les garanties concernent aussi sa propre sécurité","Each sign of progress lowers the ‘war premium’ in energy prices; a breakdown raises it":"Chaque signe de progrès réduit la « prime de guerre » dans les prix de l’énergie ; un échec la fait remonter","Feb 2022":"févr. 2022","Russia launches its full-scale invasion of Ukraine.":"La Russie lance son invasion à grande échelle de l’Ukraine.","Jan 2026":"janv. 2026","First three-way talks in Abu Dhabi. No deal: Russia demands the rest of Donbas.":"Premiers pourparlers à trois à Abou Dhabi. Pas d’accord : la Russie exige le reste du Donbass.","Feb 2026":"févr. 2026","Second Abu Dhabi round ends with a 314-prisoner swap, the first in five months. Talks then stall when the Iran war begins.":"La deuxième session d’Abou Dhabi se conclut par un échange de 314 prisonniers, le premier en cinq mois. Les pourparlers s’enlisent ensuite quand la guerre en Iran commence.","2 Nov 2026":"2 nov. 2026","US envoy Steve Witkoff announces a new round in Abu Dhabi.":"L’émissaire américain Steve Witkoff annonce une nouvelle session à Abou Dhabi.","10–11 Nov":"10–11 nov.","Fourth round: another prisoner swap agreed, big gaps remain.":"Quatrième session : un nouvel échange de prisonniers est convenu, de profonds désaccords demeurent.","Each round so far has produced humanitarian steps such as prisoner exchanges, but no movement on territory, the core dispute.":"Jusqu’ici, chaque session a débouché sur des gestes humanitaires, comme des échanges de prisonniers, mais sur aucune avancée concernant les territoires, le cœur du différend.","Ukraine":"Ukraine","Ukrainian news agency":"Agence de presse ukrainienne","Kyiv’s negotiator Rustem Umerov calls the prisoner exchange the main result and says the first step must be an end to the war and security guarantees for Ukraine.":"Le négociateur de Kiev, Roustem Oumerov, présente l’échange de prisonniers comme le principal résultat et dit que la première étape doit être la fin de la guerre et des garanties de sécurité pour l’Ukraine.","Russia":"Russie","Russian state news agency":"Agence de presse d’État russe","The Kremlin presents the talks as a strictly three-way format with the US as mediator, focused on security guarantees, with “all the details” kept behind closed doors. Moscow said no European representatives would take part.":"Le Kremlin présente les pourparlers comme un format strictement à trois, avec les États-Unis comme médiateur, centré sur les garanties de sécurité, « tous les détails » restant à huis clos. Moscou a dit qu’aucun représentant européen n’y participerait.","United States":"États-Unis","US public radio · independent Russian outlet based in Latvia":"Radio publique américaine · média russe indépendant basé en Lettonie","Jared Kushner said a lasting settlement will also need direct talks between Russia and Europe on wider security. Marco Rubio said nothing had been finalised yet.":"Jared Kushner a dit qu’un règlement durable passera aussi par des discussions directes entre la Russie et l’Europe sur la sécurité au sens large. Marco Rubio a dit que rien n’était encore finalisé.","Europe":"Europe","European officials aim to strengthen Ukraine’s position and stop Russia from using the talks to reshape Europe’s security order. Security advisers from France, Germany and the UK joined parts of the talks.":"Les responsables européens veulent renforcer la position de l’Ukraine et empêcher la Russie de se servir des pourparlers pour redessiner l’ordre de sécurité européen. Des conseillers à la sécurité de la France, de l’Allemagne et du Royaume-Uni ont participé à une partie des discussions.","Critical analysis":"Analyse critique","EU-based policy magazine":"Magazine d’analyse politique basé dans l’UE","Argues that discussing guarantees before territory gives Moscow leverage to trade Ukraine’s protection for land in Donbas.":"Estime que discuter des garanties avant les territoires donne à Moscou un levier pour échanger la protection de l’Ukraine contre des terres dans le Donbass.","The same US envoys, Witkoff and Kushner, are involved in diplomacy with Iran.":"Les mêmes émissaires américains, Witkoff et Kushner, participent à la diplomatie avec l’Iran.","Oil fell last week partly on hopes of ending both wars.":"Le pétrole a baissé la semaine dernière, en partie grâce à l’espoir de mettre fin aux deux guerres.","Europe is pressing to join the talks despite Kremlin objections.":"L’Europe insiste pour rejoindre les pourparlers malgré les objections du Kremlin.","Slow progress":"Progrès lents","Talks continue in working groups. More humanitarian deals, no ceasefire before winter.":"Les discussions se poursuivent en groupes de travail. D’autres accords humanitaires, pas de cessez-le-feu avant l’hiver.","Little change. Energy prices stay sensitive to headlines.":"Peu de changement. Les prix de l’énergie restent sensibles aux annonces.","Partial deal":"Accord partiel","An agreement on one area, for example energy infrastructure or the Black Sea, which were on the agenda.":"Un accord sur un seul domaine, par exemple les infrastructures énergétiques ou la mer Noire, qui étaient à l’ordre du jour.","Gas and wheat prices ease. Ukrainian bonds rise.":"Les prix du gaz et du blé se détendent. Les obligations ukrainiennes montent.","Breakdown":"Rupture","Talks collapse and fighting escalates.":"Les pourparlers échouent et les combats s’intensifient.","Oil and gas up, European defence stocks up, euro weaker.":"Pétrole et gaz en hausse, valeurs européennes de la défense en hausse, euro plus faible.","When the prisoner exchange happens":"La date de l’échange de prisonniers","Whether a next round is scheduled":"Si une nouvelle session est programmée","Europe’s formal role in the talks":"Le rôle officiel de l’Europe dans les pourparlers","Oil & gas":"Pétrole et gaz","Peace hopes reduce the risk premium":"Les espoirs de paix réduisent la prime de risque","Wheat":"Blé","Would fall only if a Black Sea deal emerges":"Ne baisserait que si un accord sur la mer Noire se dessine","European defence stocks":"Valeurs européennes de la défense","Rearmament continues either way":"Le réarmement se poursuit dans tous les cas","Construction, energy and engineering firms follow plans for post-war reconstruction.":"Les entreprises de construction, d’énergie et d’ingénierie suivent les plans de reconstruction d’après-guerre.","Shipping and insurance firms watch the Black Sea talks for grain and cargo routes.":"Les compagnies maritimes et les assureurs surveillent les discussions sur la mer Noire pour les routes des céréales et du fret.","European manufacturers remain exposed to energy prices if talks fail.":"Les industriels européens restent exposés aux prix de l’énergie si les pourparlers échouent.","Security guarantees":"Garanties de sécurité","Promises by other countries to protect Ukraine if Russia attacks again, for example with weapons, troops or a defence treaty.":"Promesses d’autres pays de protéger l’Ukraine si la Russie attaque à nouveau, par exemple avec des armes, des troupes ou un traité de défense.","Trilateral talks":"Pourparlers trilatéraux","Negotiations between three parties. Here the US sits between Russia and Ukraine as mediator.":"Négociations entre trois parties. Ici, les États-Unis servent de médiateur entre la Russie et l’Ukraine.","Donbas":"Donbass","Ukraine’s eastern industrial region (Donetsk and Luhansk). Russia controls most of it and wants all of it.":"Région industrielle de l’est de l’Ukraine (Donetsk et Louhansk). La Russie en contrôle la plus grande partie et la veut tout entière.","Think of it as mediation between two countries at war, with the US as mediator. Both sides agreed to swap prisoners, a small but concrete step. On the big questions, who controls which land and who protects Ukraine afterwards, they are still far apart.":"Imaginez une médiation entre deux pays en guerre, avec les États-Unis comme médiateur. Les deux camps ont accepté d’échanger des prisonniers, un pas modeste mais concret. Sur les grandes questions, qui contrôle quelles terres et qui protège l’Ukraine ensuite, ils restent très éloignés.","What was the main concrete result of the Abu Dhabi talks on 10–11 November?":"Quel a été le principal résultat concret des pourparlers d’Abou Dhabi des 10 et 11 novembre ?","A ceasefire":"Un cessez-le-feu","A prisoner exchange":"Un échange de prisonniers","A deal on Donbas":"Un accord sur le Donbass","A peace treaty":"Un traité de paix","Ukraine’s negotiator said the prisoner exchange was the main outcome, and that big differences remain.":"Le négociateur ukrainien a dit que l’échange de prisonniers était le principal résultat et que de grandes divergences demeurent.","Which region is at the heart of the territorial dispute in the talks?":"Quelle région est au cœur du différend territorial dans les pourparlers ?","Odesa":"Odessa","Kharkiv":"Kharkiv","Lviv":"Lviv","Russia demands that Ukraine withdraw from the parts of Donbas it still controls. Kyiv refuses.":"La Russie exige que l’Ukraine se retire des parties du Donbass qu’elle contrôle encore. Kiev refuse.","Russia and Ukraine have been fighting since 2014, and in a full-scale war since February 2022. Russia occupies about a fifth of Ukraine. The US has been trying to broker a deal, but each round of talks ends the same way: prisoner swaps, but no agreement on the big question of who keeps which land and who protects Ukraine afterwards.":"La Russie et l’Ukraine s’affrontent depuis 2014, et dans une guerre à grande échelle depuis février 2022. La Russie occupe environ un cinquième de l’Ukraine. Les États-Unis tentent de négocier un accord, mais chaque session se termine de la même façon : des échanges de prisonniers, mais aucun accord sur la grande question, à savoir qui garde quelles terres et qui protège l’Ukraine ensuite.","Russia’s president. Demands that Ukraine withdraw from the parts of Donbas it still controls.":"Président de la Russie. Il exige que l’Ukraine se retire des parties du Donbass qu’elle contrôle encore.","Ukraine’s president. Refuses to give up that territory.":"Président de l’Ukraine. Il refuse de céder ce territoire.","President Trump’s envoys. They mediate between Moscow and Kyiv.":"Émissaires du président Trump. Ils servent de médiateurs entre Moscou et Kiev.","Leads Ukraine’s negotiating team.":"Il dirige l’équipe de négociation ukrainienne.","Kremlin aide who leads Russia’s team.":"Conseiller du Kremlin, il dirige l’équipe russe.","Want a seat at the table, because guarantees for Ukraine also concern Europe’s security. Moscow objects.":"Ils veulent une place à la table, car les garanties pour l’Ukraine concernent aussi la sécurité de l’Europe. Moscou s’y oppose.","Mar 2014":"mars 2014","Russia seizes and annexes Crimea. Fighting breaks out in eastern Ukraine and continues on and off for eight years.":"La Russie s’empare de la Crimée et l’annexe. Des combats éclatent dans l’est de l’Ukraine et se poursuivent par intermittence pendant huit ans.","The start of the conflict, and of the land dispute at the heart of today’s talks.":"Le début du conflit, et du différend territorial au cœur des pourparlers actuels.","24 Feb 2022":"24 févr. 2022","Russia launches a full-scale invasion of Ukraine.":"La Russie lance une invasion à grande échelle de l’Ukraine.","The war these talks are trying to end.":"La guerre à laquelle ces pourparlers tentent de mettre fin.","Late 2022":"Fin 2022","Russia illegally annexes four more Ukrainian regions that it partly occupies.":"La Russie annexe illégalement quatre autres régions ukrainiennes qu’elle occupe en partie.","Moscow treats these regions as its own, which makes any compromise on land very hard.":"Moscou considère ces régions comme les siennes, ce qui rend tout compromis territorial très difficile.","May 2025":"mai 2025","Talks in Istanbul lead to a 1,000-for-1,000 prisoner exchange.":"Des pourparlers à Istanbul débouchent sur un échange de 1 000 prisonniers contre 1 000.","Sets the pattern: humanitarian deals, but no peace.":"Le schéma est posé : des accords humanitaires, mais pas de paix.","Dec 2025":"déc. 2025","Witkoff and Kushner spend several hours with Putin in Moscow discussing a US peace plan. No breakthrough.":"Witkoff et Kushner passent plusieurs heures avec Poutine à Moscou pour discuter d’un plan de paix américain. Pas de percée.","After meeting the US envoys, Putin agrees to the first three-way talks with Ukraine and the US, in Abu Dhabi. No deal: Russia demands the rest of Donbas.":"Après avoir rencontré les émissaires américains, Poutine accepte les premiers pourparlers à trois avec l’Ukraine et les États-Unis, à Abou Dhabi. Pas d’accord : la Russie exige le reste du Donbass.","Second Abu Dhabi round: a 314-prisoner swap, and the US and Russia agree to restore military-to-military contacts.":"Deuxième session d’Abou Dhabi : un échange de 314 prisonniers, et les États-Unis et la Russie conviennent de rétablir les contacts entre leurs armées.","28 Feb 2026":"28 févr. 2026","The US–Israeli war with Iran begins. The Ukraine talks stall.":"La guerre des États-Unis et d’Israël contre l’Iran commence. Les pourparlers sur l’Ukraine s’enlisent.","They only restart in September.":"Ils ne reprennent qu’en septembre.","Sep 2026":"sept. 2026","Witkoff and Kushner restart talks: first at the Kremlin, then on their first visit to Kyiv.":"Witkoff et Kushner relancent les pourparlers : d’abord au Kremlin, puis lors de leur première visite à Kiev.","21 Oct 2026":"21 oct. 2026","Witkoff meets Putin in St Petersburg. A retired American teacher is released, and a technical-level three-way meeting is proposed.":"Witkoff rencontre Poutine à Saint-Pétersbourg. Un enseignant américain à la retraite est libéré, et une réunion à trois au niveau technique est proposée.","23 Oct 2026":"23 oct. 2026","Russia and Ukraine swap 270 prisoners each.":"La Russie et l’Ukraine échangent 270 prisonniers chacune.","10–11 Nov 2026":"10–11 nov. 2026","Fourth Abu Dhabi round: a large prisoner swap is agreed in principle, with no breakthrough on land or a ceasefire.":"Quatrième session d’Abou Dhabi : un vaste échange de prisonniers est convenu sur le principe, sans percée sur les territoires ni sur un cessez-le-feu.","Next":"À venir","The US envoys plan to meet Putin and then Zelensky.":"Les émissaires américains prévoient de rencontrer Poutine, puis Zelensky.","World leaders gather in Antalya as COP31 tries to turn climate promises into action":"Les dirigeants du monde se réunissent à Antalya, où la COP31 tente de transformer les promesses climatiques en actes","The UN climate summit runs until 20 November. A new UN report says current pledges still lead to about 2.6°C of warming this century.":"Le sommet de l’ONU sur le climat dure jusqu’au 20 novembre. Un nouveau rapport de l’ONU indique que les engagements actuels mènent encore à un réchauffement d’environ 2,6 °C au cours de ce siècle.","This is where governments decide how fast the world moves away from fossil fuels and who pays for it. That shapes energy prices, regulation and investment for years.":"C’est ici que les gouvernements décident à quelle vitesse le monde sort des énergies fossiles et qui paie. Cela pèse sur les prix de l’énergie, la réglementation et les investissements pendant des années.","A 2026 UN report projects about 2.6°C of warming this century even if countries fully meet their pledges, well above the Paris Agreement goals.":"Un rapport de l’ONU de 2026 prévoit un réchauffement d’environ 2,6 °C au cours de ce siècle, même si les pays tiennent tous leurs engagements, bien au-dessus des objectifs de l’accord de Paris.","Countries submitted updated national climate plans (NDCs) in 2025. COP31 is meant to test whether they are being implemented.":"Les pays ont présenté en 2025 leurs plans climat nationaux mis à jour (CDN). La COP31 doit vérifier s’ils sont appliqués.","The summit follows a year of severe floods, heat waves and droughts, adding pressure for faster cuts and more finance.":"Le sommet fait suite à une année d’inondations, de canicules et de sécheresses graves, ce qui accroît la pression pour des réductions plus rapides et plus de financements.","COP31 opened on 9 November in Antalya, Türkiye, and runs until 20 November.":"La COP31 s’est ouverte le 9 novembre à Antalya, en Turquie, et dure jusqu’au 20 novembre.","An unusual split: Türkiye hosts and holds the presidency, while Australia’s climate minister Chris Bowen leads the negotiations.":"Un partage inhabituel : la Turquie accueille le sommet et en assure la présidence, tandis que le ministre australien du Climat, Chris Bowen, conduit les négociations.","A World Leaders’ Summit takes place on 11–12 November.":"Un sommet des dirigeants mondiaux a lieu les 11 et 12 novembre.","The talks opened with an early fight over money: developing countries pushed to put climate finance on the official agenda.":"Les discussions ont commencé par un bras de fer sur l’argent : les pays en développement ont insisté pour inscrire le financement climatique à l’ordre du jour officiel.","The theme is “COP of Implementation”: turning past promises into measurable results.":"Le thème est « la COP de la mise en œuvre » : transformer les promesses passées en résultats mesurables.","Pledges fall short of the Paris goals":"Les engagements sont en deçà des objectifs de Paris","Pressure grows for more money for developing countries":"La pression monte pour plus d’argent en faveur des pays en développement","Richer countries face tight budgets in a year of high energy costs":"Les pays riches ont des budgets serrés, dans une année d’énergie chère","The outcome shapes rules and investment in clean energy":"Le résultat pèse sur les règles et les investissements dans les énergies propres","Paris Agreement: keep warming well below 2°C.":"Accord de Paris : maintenir le réchauffement bien en dessous de 2 °C.","COP29 in Baku agrees a new climate finance goal (the NCQG).":"La COP29 à Bakou fixe un nouvel objectif de financement climatique (le NCQG).","COP30 in Belém, Brazil. Countries submit updated climate plans.":"COP30 à Belém, au Brésil. Les pays présentent leurs plans climat mis à jour.","Türkiye and Australia both want to host; they agree to share the role.":"La Turquie et l’Australie veulent toutes deux accueillir le sommet ; elles conviennent de partager le rôle.","9 Nov 2026":"9 nov. 2026","COP31 opens in Antalya.":"La COP31 s’ouvre à Antalya.","Each COP agrees new goals, but the gap between promises and actual emission cuts remains large.":"Chaque COP fixe de nouveaux objectifs, mais l’écart entre les promesses et les réductions réelles d’émissions reste important.","Türkiye (host)":"Turquie (pays hôte)","President Erdogan argues that countries cannot move at the same pace while gaps in finance and technology persist, and that climate targets must match social and economic realities.":"Le président Erdogan affirme que les pays ne peuvent pas avancer au même rythme tant que des écarts de financement et de technologie persistent, et que les objectifs climatiques doivent tenir compte des réalités sociales et économiques.","Türkiye’s government":"Gouvernement turc","Turkish state broadcaster":"Télévision publique turque","Environment minister Murat Kurum says developed countries must deliver the finance they promised, and backs the $1.3 trillion “Baku to Belém Roadmap”.":"Le ministre de l’Environnement, Murat Kurum, dit que les pays développés doivent verser les financements promis et soutient la « feuille de route de Bakou à Belém » de 1 300 milliards de dollars.","United Nations":"Nations unies","UAE daily":"Quotidien des Émirats arabes unis","The UN secretary-general told leaders to “get serious”: cut emissions faster, move away from fossil fuels and deliver finance to vulnerable countries.":"Le secrétaire général de l’ONU a demandé aux dirigeants de « passer aux choses sérieuses » : réduire les émissions plus vite, sortir des énergies fossiles et financer les pays vulnérables.","Developing countries":"Pays en développement","They fought to put climate finance on the official agenda before the summit opened. A “climate finance work programme” was added.":"Ils se sont battus pour inscrire le financement climatique à l’ordre du jour officiel avant l’ouverture du sommet. Un « programme de travail sur le financement climatique » a été ajouté.","Pacific island states":"États insulaires du Pacifique","Turkish daily, citing the state news agency":"Quotidien turc, citant l’agence de presse d’État","Pre-summit meetings in Fiji and Tuvalu were organised to amplify island nations facing existential climate threats.":"Des réunions préparatoires aux Fidji et aux Tuvalu ont été organisées pour faire entendre les nations insulaires, dont l’existence même est menacée par le climat.","Energy security is under pressure: Reuters calculates almost half the world’s oil now comes from countries affected by conflict.":"La sécurité énergétique est sous pression : selon les calculs de Reuters, près de la moitié du pétrole mondial vient désormais de pays touchés par un conflit.","High energy prices this year have pushed central banks to raise rates.":"Les prix élevés de l’énergie cette année ont poussé les banques centrales à relever leurs taux.","Modest deal":"Accord modeste","Agreement on tracking and implementing existing pledges, no major new targets.":"Un accord sur le suivi et l’application des engagements existants, sans nouveaux objectifs majeurs.","Limited market impact.":"Effet limité sur les marchés.","Finance package":"Paquet financier","A stronger package to help vulnerable countries adapt.":"Un paquet renforcé pour aider les pays vulnérables à s’adapter.","Positive for clean-energy and infrastructure firms.":"Positif pour les entreprises des énergies propres et des infrastructures.","Stalemate":"Blocage","Talks stall over money and end with a weak text.":"Les discussions s’enlisent sur l’argent et se terminent par un texte faible.","Clean-energy stocks under pressure.":"Les valeurs des énergies propres sous pression.","Leaders’ speeches on 11–12 November":"Les discours des dirigeants les 11 et 12 novembre","The climate finance text":"Le texte sur le financement climatique","The final agreement around 20 November":"L’accord final, vers le 20 novembre","Clean-energy stocks":"Valeurs des énergies propres","Depends on the finance outcome":"Dépend du résultat sur le financement","Carbon markets":"Marchés du carbone","New rules could change demand":"De nouvelles règles pourraient modifier la demande","Companies may face stricter climate reporting and transition rules.":"Les entreprises pourraient faire face à des règles plus strictes sur le reporting climatique et la transition.","Adaptation spending (flood defences, water, resilient buildings) creates contracts.":"Les dépenses d’adaptation (protection contre les inondations, eau, bâtiments résistants) créent des contrats.","Energy-intensive firms watch for signals on moving away from fossil fuels.":"Les entreprises très consommatrices d’énergie guettent les signaux sur la sortie des énergies fossiles.","COP":"COP","“Conference of the Parties”: the yearly UN climate summit where almost every country negotiates.":"« Conférence des Parties » : le sommet annuel de l’ONU sur le climat, où presque tous les pays négocient.","NDC":"CDN","“Nationally Determined Contribution”: each country’s own climate plan and emissions target.":"« Contribution déterminée au niveau national » : le plan climat et l’objectif d’émissions propres à chaque pays.","Climate finance":"Financement climatique","Money from richer countries to help poorer ones cut emissions and adapt to climate impacts.":"Argent versé par les pays riches pour aider les plus pauvres à réduire leurs émissions et à s’adapter aux effets du climat.","Once a year, almost every country meets to agree how to slow climate change. The promises made so far would still warm the planet by about 2.6°C. This year’s meeting in Türkiye is about checking that countries do what they promised, and finding money for poorer countries.":"Une fois par an, presque tous les pays se réunissent pour convenir de la manière de ralentir le changement climatique. Les promesses faites jusqu’ici réchaufferaient encore la planète d’environ 2,6 °C. La réunion de cette année, en Turquie, sert à vérifier que les pays font ce qu’ils ont promis et à trouver de l’argent pour les pays pauvres.","Where is COP31 being held?":"Où se tient la COP31 ?","Belém, Brazil":"Belém, Brésil","Antalya, Türkiye":"Antalya, Turquie","Baku, Azerbaijan":"Bakou, Azerbaïdjan","Sydney, Australia":"Sydney, Australie","COP31 runs from 9 to 20 November in Antalya. Türkiye hosts, while Australia leads the negotiations.":"La COP31 se tient du 9 au 20 novembre à Antalya. La Turquie accueille le sommet, tandis que l’Australie conduit les négociations.","According to a 2026 UN report, how much warming do current pledges lead to this century?":"Selon un rapport de l’ONU de 2026, à quel réchauffement mènent les engagements actuels au cours de ce siècle ?","About 1.5°C":"Environ 1,5 °C","About 2.0°C":"Environ 2,0 °C","About 2.6°C":"Environ 2,6 °C","About 4°C":"Environ 4 °C","The UN projects about 2.6°C even if countries fully meet their pledges, well above the Paris goals.":"L’ONU prévoit environ 2,6 °C même si les pays tiennent tous leurs engagements, bien au-dessus des objectifs de Paris.","Every year almost every country meets at a UN climate summit, called a COP, to agree how to limit global warming. The main target was set in Paris in 2015: keep warming well below 2°C, ideally 1.5°C. Countries’ current plans still point to about 2.6°C, so each summit is a fight over how fast to move away from fossil fuels and who pays for it.":"Chaque année, presque tous les pays se retrouvent à un sommet de l’ONU sur le climat, appelé COP, pour convenir de la manière de limiter le réchauffement. L’objectif principal a été fixé à Paris en 2015 : maintenir le réchauffement bien en dessous de 2 °C, si possible à 1,5 °C. Les plans actuels des pays mènent encore à environ 2,6 °C, si bien que chaque sommet est une bataille sur la vitesse de sortie des énergies fossiles et sur qui paie.","Host and COP31 president, through environment minister Murat Kurum.":"Pays hôte et président de la COP31, par la voix du ministre de l’Environnement Murat Kurum.","Leads the negotiations, through climate minister Chris Bowen.":"Conduit les négociations, par la voix du ministre du Climat Chris Bowen.","UN Secretary-General. This is his last climate summit in the job.":"Secrétaire général de l’ONU. C’est son dernier sommet sur le climat à ce poste.","Push for more money from richer countries to cope with climate damage.":"Réclament plus d’argent des pays riches pour faire face aux dégâts climatiques.","The Trump administration sent no officials. A congressional delegation is attending.":"L’administration Trump n’a envoyé aucun responsable. Une délégation du Congrès est présente.","The first UN climate summit (COP). One has been held every year since.":"Le premier sommet de l’ONU sur le climat (COP). Il y en a eu un chaque année depuis.","Kyoto Protocol: 37 industrialised countries must cut their emissions.":"Protocole de Kyoto : 37 pays industrialisés doivent réduire leurs émissions.","Dec 2015":"déc. 2015","Paris Agreement: keep warming well below 2°C and aim for 1.5°C. Each country writes its own plan (NDC) and updates it every five years.":"Accord de Paris : maintenir le réchauffement bien en dessous de 2 °C et viser 1,5 °C. Chaque pays rédige son propre plan (CDN) et le met à jour tous les cinq ans.","Still the rulebook every summit works from.":"Il reste le cadre de référence de chaque sommet.","Dec 2023":"déc. 2023","COP28 in Dubai: for the first time, countries agree to “transition away” from fossil fuels.":"COP28 à Dubaï : pour la première fois, les pays conviennent d’« opérer une transition hors » des énergies fossiles.","The question now is how fast, which is what COP31 argues about.":"La question est désormais de savoir à quelle vitesse, et c’est l’objet des débats de la COP31.","Nov 2024":"nov. 2024","Jan 2025":"janv. 2025","President Trump orders the US to leave the Paris Agreement, for the second time.":"Le président Trump ordonne le retrait des États-Unis de l’accord de Paris, pour la deuxième fois.","The US is not at the table in Antalya.":"Les États-Unis ne sont pas à la table des négociations à Antalya.","Nov 2025":"nov. 2025","COP30 in Belém, Brazil. Countries submit updated plans, and a tropical forest fund (TFFF) launches with about $5.5 billion in pledges.":"COP30 à Belém, au Brésil. Les pays présentent leurs plans mis à jour, et un fonds pour les forêts tropicales (TFFF) est lancé avec environ 5,5 milliards de dollars de promesses.","The war with Iran triggers an oil price shock, putting energy security next to climate on the agenda.":"La guerre avec l’Iran provoque un choc pétrolier et place la sécurité énergétique à côté du climat à l’ordre du jour.","Türkiye and Australia both want to host COP31. They agree to share the role.":"La Turquie et l’Australie veulent toutes deux accueillir la COP31. Elles conviennent de partager le rôle.","COP31 opens in Antalya, with an early fight over money for developing countries.":"La COP31 s’ouvre à Antalya, avec d’emblée un bras de fer sur l’argent destiné aux pays en développement.","11 Nov 2026":"11 nov. 2026","At the leaders’ summit, Guterres proposes a “Climate Justice Compact” and says polluters must pay.":"Au sommet des dirigeants, Guterres propose un « pacte pour la justice climatique » et dit que les pollueurs doivent payer.","20 Nov 2026":"20 nov. 2026","Scheduled end of the talks.":"Fin prévue des discussions.","US–Iran talks continue through Qatar as Washington weighs its next move":"Les pourparlers États-Unis–Iran se poursuivent via le Qatar, tandis que Washington réfléchit à la suite","Nine months into the war, mediators are trying to restart a peace process. Iran calls US outreach “a positive step” but sets conditions.":"Neuf mois après le début de la guerre, des médiateurs tentent de relancer un processus de paix. L’Iran qualifie la démarche américaine de « pas positif », mais pose des conditions.","The war threatens the Strait of Hormuz, a key route for Gulf oil. Progress or failure here moves oil prices, inflation and central bank decisions around the world.":"La guerre menace le détroit d’Ormuz, une route essentielle pour le pétrole du Golfe. Un progrès ou un échec ici fait bouger les prix du pétrole, l’inflation et les décisions des banques centrales dans le monde entier.","The US and Israel launched a war against Iran in late February 2026.":"Les États-Unis et Israël ont lancé une guerre contre l’Iran fin février 2026.","Talks led by US Vice President JD Vance in Islamabad in April produced an initial agreement. It unravelled after Iran’s Revolutionary Guards resumed attacks on commercial shipping.":"Des pourparlers menés par le vice-président américain JD Vance à Islamabad en avril avaient abouti à un premier accord. Il s’est défait après la reprise des attaques des Gardiens de la révolution iraniens contre des navires de commerce.","Qatar, alongside Pakistan, has mediated between the two sides for months.":"Le Qatar, avec le Pakistan, sert de médiateur entre les deux camps depuis des mois.","Iranian envoys met Qatari mediators in Doha on 31 October, after more than 12 hours of talks in Tehran the day before.":"Des émissaires iraniens ont rencontré les médiateurs qataris à Doha le 31 octobre, après plus de 12 heures de discussions à Téhéran la veille.","Iran’s foreign minister called a letter from JD Vance “a positive step”, but said talks depend on Iran’s conditions being met.":"Le ministre iranien des Affaires étrangères a qualifié une lettre de JD Vance de « pas positif », mais a dit que les pourparlers dépendent du respect des conditions de l’Iran.","Secretary of State Marco Rubio said Qatar-led talks are ongoing and have “never stopped”.":"Le secrétaire d’État Marco Rubio a dit que les discussions menées par le Qatar se poursuivent et ne se sont « jamais arrêtées ».","On 6 November, Trump told reporters: “We’re talking to them.”":"Le 6 novembre, Trump a dit aux journalistes : « Nous leur parlons. »","Before the midterms, Trump had repeatedly suggested the US could attack Iran after the 3 November vote.":"Avant les élections de mi-mandat, Trump avait laissé entendre à plusieurs reprises que les États-Unis pourraient attaquer l’Iran après le vote du 3 novembre.","Talks make progress":"Les pourparlers avancent","Lower risk of attacks on tankers in the Gulf":"Moins de risque d’attaques contre les pétroliers dans le Golfe","Oil prices fall":"Les prix du pétrole baissent","Inflation pressure eases":"La pression sur l’inflation diminue","Central banks feel less need to raise rates":"Les banques centrales ressentent moins le besoin de relever leurs taux","Late Feb 2026":"Fin févr. 2026","The US and Israel launch a war against Iran. Ukraine peace talks are paused.":"Les États-Unis et Israël lancent une guerre contre l’Iran. Les pourparlers de paix sur l’Ukraine sont suspendus.","Apr 2026":"avr. 2026","Talks in Islamabad led by JD Vance produce an initial agreement.":"Des pourparlers à Islamabad, menés par JD Vance, aboutissent à un premier accord.","Summer 2026":"Été 2026","The deal unravels after new attacks on shipping. Qatar steps up mediation in Doha.":"L’accord se défait après de nouvelles attaques contre des navires. Le Qatar intensifie sa médiation à Doha.","31 Oct":"31 oct.","Iran calls a letter from Vance a positive step; its envoys meet mediators in Doha.":"L’Iran qualifie une lettre de Vance de pas positif ; ses émissaires rencontrent les médiateurs à Doha.","6 Nov":"6 nov.","Trump says the US is talking to Tehran.":"Trump dit que les États-Unis parlent à Téhéran.","Talks repeatedly make progress, then stall after new attacks. Oil prices swing with every headline.":"Les pourparlers avancent à plusieurs reprises, puis s’enlisent après de nouvelles attaques. Les prix du pétrole réagissent à chaque annonce.","Iran":"Iran","Qatar-based broadcaster · Iranian semi-official news agency":"Chaîne basée au Qatar · agence de presse iranienne semi-officielle","Foreign Minister Abbas Araghchi called the US outreach “a positive step” but set conditions: lifting sanctions imposed after the Islamabad memorandum, fewer US forces in the region, restored oil waivers and the release of frozen funds. He said there were no plans yet to meet US officials.":"Le ministre des Affaires étrangères, Abbas Araghchi, a qualifié la démarche américaine de « pas positif », mais a posé des conditions : la levée des sanctions imposées après le mémorandum d’Islamabad, moins de forces américaines dans la région, le rétablissement des dérogations pétrolières et le déblocage des fonds gelés. Il a dit qu’aucune rencontre avec des responsables américains n’était prévue pour l’instant.","Marco Rubio says talks have never stopped and the US is open to a diplomatic solution. Trump says talks are “going fine”, but that the US still has Iranian targets.":"Marco Rubio dit que les discussions n’ont jamais cessé et que les États-Unis sont ouverts à une solution diplomatique. Trump dit que les discussions « se passent bien », mais que les États-Unis ont encore des cibles iraniennes.","Qatar (mediator)":"Qatar (médiateur)","Indian weekly · Israeli daily":"Hebdomadaire indien · quotidien israélien","Qatar denied reports that its prime minister had called the talks a failure. Qatari and Pakistani mediators continue to discuss Iran’s conditions.":"Le Qatar a démenti les informations selon lesquelles son Premier ministre aurait qualifié les pourparlers d’échec. Les médiateurs qataris et pakistanais continuent de discuter des conditions de l’Iran.","Analysts":"Analystes","One analyst argued that before the US midterms Iran had an incentive to delay concessions to deny Trump a diplomatic win, a calculation that could change after the vote.":"Un analyste a estimé qu’avant les élections américaines de mi-mandat, l’Iran avait intérêt à retarder ses concessions pour priver Trump d’un succès diplomatique, un calcul qui pourrait changer après le vote.","Oil had one of its steepest weekly drops on hopes of a deal.":"Le pétrole a connu l’une de ses plus fortes baisses hebdomadaires, sur l’espoir d’un accord.","Republican leaders, including Vance, blamed the Iran war for their midterm defeat.":"Les dirigeants républicains, dont Vance, ont attribué leur défaite aux élections de mi-mandat à la guerre en Iran.","Witkoff and Kushner, who have worked on Iran diplomacy, also lead the US side in the Ukraine talks.":"Witkoff et Kushner, qui ont travaillé sur la diplomatie avec l’Iran, dirigent aussi la partie américaine dans les pourparlers sur l’Ukraine.","Slow talks":"Pourparlers lents","Indirect talks continue without a full deal soon.":"Les pourparlers indirects se poursuivent, sans accord complet à court terme.","Oil stays volatile and headline-driven.":"Le pétrole reste volatil et réagit aux annonces.","New ceasefire":"Nouveau cessez-le-feu","A new ceasefire or interim deal.":"Un nouveau cessez-le-feu ou un accord provisoire.","Oil falls further. Airlines and shipping gain. Gold eases.":"Le pétrole baisse encore. Les compagnies aériennes et le transport maritime en profitent. L’or recule.","Renewed strikes":"Reprise des frappes","The US resumes military action.":"Les États-Unis reprennent leurs opérations militaires.","Oil jumps back above $100. Safe havens like gold and the franc rise.":"Le pétrole repasse au-dessus de 100 dollars. Les valeurs refuges comme l’or et le franc montent.","Announcements from Qatar’s foreign ministry":"Les annonces du ministère qatari des Affaires étrangères","Attacks on shipping near Hormuz":"Les attaques contre des navires près d’Ormuz","Statements from Vance or Witkoff":"Les déclarations de Vance ou de Witkoff","Oil":"Pétrole","Deal hopes push prices lower":"L’espoir d’un accord fait baisser les prix","Gold":"Or","Safe-haven demand falls if talks progress":"La demande de valeurs refuges baisse si les pourparlers avancent","Airlines & shipping":"Compagnies aériennes et transport maritime","Cheaper fuel, safer routes":"Carburant moins cher, routes plus sûres","Airlines and transport firms gain if fuel costs fall.":"Les compagnies aériennes et les transporteurs y gagnent si le coût du carburant baisse.","Shipping firms still face high freight and insurance costs in the Gulf.":"Les compagnies maritimes font encore face à des coûts de fret et d’assurance élevés dans le Golfe.","Energy-intensive industries in Europe and Asia are the most exposed.":"Les industries très consommatrices d’énergie en Europe et en Asie sont les plus exposées.","Strait of Hormuz":"Détroit d’Ormuz","A narrow sea passage between Iran and Oman. A large share of the world’s oil exports passes through it.":"Un étroit passage maritime entre l’Iran et Oman. Une grande partie des exportations mondiales de pétrole y transite.","Revolutionary Guards (IRGC)":"Gardiens de la révolution (CGRI)","Iran’s elite military force, separate from the regular army, with its own navy and strong political power.":"Force militaire d’élite de l’Iran, distincte de l’armée régulière, avec sa propre marine et un fort pouvoir politique.","Indirect talks":"Pourparlers indirects","The two sides don’t meet face to face. A mediator, here Qatar, passes messages between them.":"Les deux camps ne se rencontrent pas en face à face. Un médiateur, ici le Qatar, transmet les messages de l’un à l’autre.","The US and Iran have been at war since February. They don’t talk face to face; Qatar passes messages between them. A deal would make the Gulf safer for oil tankers, which would make fuel cheaper around the world.":"Les États-Unis et l’Iran sont en guerre depuis février. Ils ne se parlent pas directement ; le Qatar transmet les messages entre eux. Un accord rendrait le Golfe plus sûr pour les pétroliers, ce qui ferait baisser le prix du carburant dans le monde entier.","Which country leads the mediation between the US and Iran?":"Quel pays dirige la médiation entre les États-Unis et l’Iran ?","Oman":"Oman","Egypt":"Égypte","Qatar":"Qatar","Türkiye":"Turquie","Qatar leads the mediation, working alongside Pakistan.":"Le Qatar dirige la médiation, aux côtés du Pakistan.","How did Iran’s foreign minister describe the latest US outreach?":"Comment le ministre iranien des Affaires étrangères a-t-il qualifié la dernière démarche américaine ?","“A positive step”":"« Un pas positif »","“A trap”":"« Un piège »","“An ultimatum”":"« Un ultimatum »","“Irrelevant”":"« Sans intérêt »","Abbas Araghchi called it a positive step, but said talks depend on Iran’s conditions being met.":"Abbas Araghchi l’a qualifiée de pas positif, mais a dit que les pourparlers dépendent du respect des conditions de l’Iran.","Iran’s nuclear programme is at the heart of its conflict with the US and Israel. A 2015 deal limited the programme, but the US left it in 2018. In 2025 Israel and the US bombed Iran’s nuclear sites, and in February 2026 they launched a full war. Iran answered by restricting the Strait of Hormuz, which normally carries about a fifth of the world’s oil. Mediators are now trying to restart talks.":"Le programme nucléaire iranien est au cœur du conflit entre l’Iran, les États-Unis et Israël. Un accord de 2015 limitait ce programme, mais les États-Unis en sont sortis en 2018. En 2025, Israël et les États-Unis ont bombardé les sites nucléaires iraniens et, en février 2026, ils ont lancé une guerre totale. L’Iran a répondu en restreignant le détroit d’Ormuz, par où passe normalement environ un cinquième du pétrole mondial. Des médiateurs tentent maintenant de relancer les pourparlers.","Trump decides on war or peace. Vance led the April talks in Islamabad and wrote to Iran in October.":"Trump décide de la guerre ou de la paix. Vance a mené les pourparlers d’avril à Islamabad et a écrit à l’Iran en octobre.","Iran’s foreign minister and its main diplomat in the talks.":"Ministre iranien des Affaires étrangères et principal diplomate de l’Iran dans les pourparlers.","Head of Iran’s Supreme National Security Council. Says no enriched uranium will leave Iran.":"Chef du Conseil suprême de sécurité nationale iranien. Il dit qu’aucun uranium enrichi ne quittera l’Iran.","Iran’s elite military force. Its navy attacks or stops ships in Hormuz.":"Force militaire d’élite de l’Iran. Sa marine attaque ou arrête des navires à Ormuz.","Mediators who pass messages between the two sides.":"Médiateurs qui transmettent les messages entre les deux camps.","Israel’s caretaker prime minister. Wants the US to resume strikes.":"Premier ministre israélien par intérim. Il veut que les États-Unis reprennent les frappes.","Jul 2015":"juil. 2015","Nuclear deal (JCPOA): Iran accepts limits on its nuclear programme in exchange for sanctions relief.":"Accord nucléaire (JCPOA) : l’Iran accepte des limites à son programme nucléaire en échange d’un allègement des sanctions.","May 2018":"mai 2018","President Trump pulls the US out of the deal and reimposes sanctions.":"Le président Trump retire les États-Unis de l’accord et rétablit les sanctions.","Jun 2025":"juin 2025","Twelve-day war: Israel strikes Iran, then US bombers hit the Fordow, Natanz and Isfahan nuclear sites.":"Guerre des douze jours : Israël frappe l’Iran, puis des bombardiers américains visent les sites nucléaires de Fordo, Natanz et Ispahan.","The US and Israel launch a war against Iran. Iran restricts shipping through the Strait of Hormuz.":"Les États-Unis et Israël lancent une guerre contre l’Iran. L’Iran restreint la navigation dans le détroit d’Ormuz.","Hormuz normally carries about a fifth of the world’s oil, so oil prices surge.":"Ormuz voit normalement passer environ un cinquième du pétrole mondial : les prix du pétrole s’envolent.","Spring 2026":"Printemps 2026","The US imposes a naval blockade on Iranian ports.":"Les États-Unis imposent un blocus naval des ports iraniens.","The deal unravels after new attacks on shipping. Qatar steps up mediation, and US forces escort tankers through Hormuz.":"L’accord se défait après de nouvelles attaques contre des navires. Le Qatar intensifie sa médiation, et les forces américaines escortent des pétroliers dans le détroit d’Ormuz.","Oct 2026":"oct. 2026","37 ships attacked in and around Hormuz, the most in any month since the war began.":"37 navires attaqués à Ormuz et aux alentours, le chiffre mensuel le plus élevé depuis le début de la guerre.","31 Oct 2026":"31 oct. 2026","Iran calls a letter from Vance “a positive step”; its envoys meet mediators in Doha.":"L’Iran qualifie une lettre de Vance de « pas positif » ; ses émissaires rencontrent les médiateurs à Doha.","6 Nov 2026":"6 nov. 2026","10 Nov 2026":"10 nov. 2026","The Revolutionary Guards say two more tankers caught fire after hitting mines. The US has said all mines were cleared.":"Les Gardiens de la révolution disent que deux autres pétroliers ont pris feu après avoir heurté des mines. Les États-Unis avaient dit que toutes les mines avaient été retirées.","Rezaei says Iran is not negotiating, and that Hormuz stays shut until the US meets seven conditions.":"Rezaei dit que l’Iran ne négocie pas et qu’Ormuz reste fermé tant que les États-Unis n’ont pas rempli sept conditions.","Oil has one of its steepest weekly drops as peace hopes grow":"Le pétrole connaît l’une de ses plus fortes baisses hebdomadaires, portée par les espoirs de paix","Brent fell about 15% in a week to around $99 a barrel, as traders bet on US–Iran diplomacy after the US midterms.":"Le Brent a perdu environ 15 % en une semaine, à environ 99 dollars le baril, les opérateurs pariant sur la diplomatie entre les États-Unis et l’Iran après les élections américaines de mi-mandat.","Oil feeds into almost everything: fuel, transport, food and heating. A big fall eases inflation and can change what central banks do next.":"Le pétrole entre dans presque tout : carburant, transport, alimentation, chauffage. Une forte baisse réduit l’inflation et peut changer ce que les banques centrales feront ensuite.","The Iran war has made oil much more expensive: US crude was still up about 48% over 12 months in early November.":"La guerre en Iran a rendu le pétrole beaucoup plus cher : début novembre, le brut américain était encore en hausse d’environ 48 % sur 12 mois.","Attacks on oil tankers remain close to record levels.":"Les attaques contre les pétroliers restent proches de niveaux record.","Brent fell about 15% over the week to around $99 a barrel.":"Le Brent a perdu environ 15 % sur la semaine, à environ 99 dollars le baril.","Dow Jones put the weekly loss at about 14%, with crude falling below $100.":"Dow Jones a chiffré la perte hebdomadaire à environ 14 %, le brut passant sous les 100 dollars.","Prices fell 8% on Wednesday alone, after the Democrats’ sweep in the midterms.":"Les prix ont chuté de 8 % sur la seule journée de mercredi, après le raz-de-marée démocrate aux élections de mi-mandat.","Traders are betting on progress in US–Iran diplomacy.":"Les opérateurs parient sur des progrès dans la diplomatie entre les États-Unis et l’Iran.","Gulf crude exports have recovered to near pre-war levels, but transport costs remain high. US diesel and heating oil stocks are at their lowest in over two decades.":"Les exportations de brut du Golfe sont revenues près de leurs niveaux d’avant-guerre, mais les coûts de transport restent élevés. Les stocks américains de diesel et de fioul domestique sont au plus bas depuis plus de vingt ans.","Peace hopes and the US midterm result":"Les espoirs de paix et le résultat des élections américaines de mi-mandat","Traders remove part of the ‘war premium’ from prices":"Les opérateurs retirent des prix une partie de la « prime de guerre »","Cheaper fuel eases inflation":"Un carburant moins cher réduit l’inflation","The Fed and ECB feel less pressure to raise rates":"La Fed et la BCE ressentent moins de pression pour relever leurs taux","But low diesel stocks keep a risk for the winter":"Mais la faiblesse des stocks de diesel reste un risque pour l’hiver","The war with Iran disrupts Gulf supply and prices surge.":"La guerre avec l’Iran perturbe l’offre du Golfe et les prix s’envolent.","3 Nov":"3 nov.","Brent closes at $103.60, its lowest since 7 October, on hopes of ending the wars in Ukraine and Iran.":"Le Brent clôture à 103,60 dollars, son plus bas depuis le 7 octobre, sur l’espoir de mettre fin aux guerres en Ukraine et en Iran.","4 Nov":"4 nov.","Prices drop 8% in a day after the midterms.":"Les prix chutent de 8 % en une journée après les élections de mi-mandat.","Weekly loss of about 14–15%; crude below $100.":"Perte hebdomadaire d’environ 14 à 15 % ; le brut sous les 100 dollars.","Oil now trades on diplomacy headlines: hope pushes it down fast, attacks push it back up.":"Le pétrole évolue désormais au gré des annonces diplomatiques : l’espoir le fait baisser vite, les attaques le font remonter.","Bearish view":"Scénario baissier","Analysts say prices could fall further if diplomatic efforts look promising.":"Des analystes disent que les prix pourraient encore baisser si les efforts diplomatiques semblent prometteurs.","Cautious view":"Lecture prudente","The war is not over: traders are pricing in a peace that has not happened yet, while attacks on shipping continue near record levels.":"La guerre n’est pas finie : les opérateurs intègrent dans les prix une paix qui n’a pas encore eu lieu, alors que les attaques contre les navires restent proches de niveaux record.","Supply risk":"Risque sur l’offre","US diesel and heating oil stocks are at their lowest in over 20 years, a risk as winter starts.":"Les stocks américains de diesel et de fioul domestique sont au plus bas depuis plus de 20 ans, un risque au début de l’hiver.","US–Iran talks through Qatar":"Les pourparlers États-Unis–Iran via le Qatar","Democrats win both chambers of Congress":"Les démocrates remportent les deux chambres du Congrès","The Fed’s next decision on 8–9 December":"La prochaine décision de la Fed, les 8 et 9 décembre","Choppy":"Instable","Prices keep swinging on every headline from the Gulf.":"Les prix continuent de réagir à chaque annonce venue du Golfe.","Large daily moves in both directions.":"De fortes variations quotidiennes dans les deux sens.","Deal":"Accord","A US–Iran agreement pushes prices lower.":"Un accord entre les États-Unis et l’Iran fait baisser les prix.","Energy stocks down; airlines and consumers benefit.":"Valeurs de l’énergie en baisse ; les compagnies aériennes et les consommateurs en profitent.","Escalation":"Escalade","New fighting in the Gulf.":"De nouveaux combats dans le Golfe.","Brent back above $100, inflation fears return.":"Le Brent repasse au-dessus de 100 dollars, les craintes d’inflation reviennent.","US–Iran talks":"Les pourparlers États-Unis–Iran","Weekly US inventory data (EIA)":"Les données hebdomadaires sur les stocks américains (EIA)","Diesel supply as winter starts":"L’approvisionnement en diesel au début de l’hiver","Brent crude":"Brent","About −15% on the week":"Environ −15 % sur la semaine","Airline stocks":"Valeurs des compagnies aériennes","Lower fuel costs":"Coûts de carburant en baisse","Oil producers":"Producteurs de pétrole","Lower prices squeeze revenue":"La baisse des prix pèse sur les revenus","Inflation expectations":"Anticipations d’inflation","Cheaper energy":"Énergie moins chère","Airlines, logistics and chemical companies benefit from cheaper fuel.":"Les compagnies aériennes, la logistique et la chimie profitent d’un carburant moins cher.","Oil producers and service firms face lower revenue.":"Les producteurs de pétrole et les sociétés de services pétroliers voient leurs revenus baisser.","Diesel users (trucking, farming) still face tight supply this winter.":"Les utilisateurs de diesel (transport routier, agriculture) font encore face à une offre tendue cet hiver.","Brent":"Brent","The main global oil price benchmark, based on North Sea crude.":"La principale référence mondiale du prix du pétrole, fondée sur le brut de la mer du Nord.","Barrel":"Baril","The standard unit for oil: 159 litres.":"L’unité de mesure du pétrole : 159 litres.","Risk premium":"Prime de risque","The extra amount traders pay because they fear supply could be cut. It shrinks when peace looks likely.":"Le supplément que paient les opérateurs parce qu’ils craignent une rupture de l’offre. Il diminue quand la paix paraît probable.","Oil got much more expensive when the war with Iran started, because people feared tankers couldn’t get through the Gulf. Last week, hopes for peace made traders less worried, so prices dropped quickly. If talks fail, prices could jump again.":"Le pétrole est devenu beaucoup plus cher quand la guerre avec l’Iran a commencé, parce qu’on craignait que les pétroliers ne puissent plus traverser le Golfe. La semaine dernière, les espoirs de paix ont rassuré les opérateurs et les prix ont vite baissé. Si les pourparlers échouent, les prix pourraient de nouveau bondir.","About how much did Brent fall in the week to 6 November?":"De combien environ le Brent a-t-il baissé sur la semaine achevée le 6 novembre ?","About 2%":"Environ 2 %","About 15%":"Environ 15 %","About 30%":"Environ 30 %","About 50%":"Environ 50 %","Brent fell about 14–15% over the week, to around $99 a barrel.":"Le Brent a perdu environ 14 à 15 % sur la semaine, à environ 99 dollars le baril.","What mainly pushed oil prices down that week?":"Qu’est-ce qui a surtout fait baisser les prix du pétrole cette semaine-là ?","OPEC raised output":"L’OPEP a augmenté sa production","A mild winter":"Un hiver doux","Hopes of US–Iran diplomacy":"Les espoirs de diplomatie entre les États-Unis et l’Iran","A stronger euro":"Un euro plus fort","Traders bet that US–Iran diplomacy would make Gulf supply safer, so they removed part of the war premium.":"Les opérateurs ont parié que la diplomatie entre les États-Unis et l’Iran rendrait l’offre du Golfe plus sûre et ont donc retiré une partie de la prime de guerre.","Oil drives the cost of fuel, transport, food and heating, so its price touches almost everyone. About a fifth of the world’s oil normally passes through the Strait of Hormuz, between Iran and Oman. When the Iran war choked that route in 2026, prices had their biggest monthly jump on record. Since then, signs of peace push prices down and new attacks push them back up.":"Le pétrole détermine le coût du carburant, du transport, de l’alimentation et du chauffage : son prix touche presque tout le monde. Environ un cinquième du pétrole mondial passe normalement par le détroit d’Ormuz, entre l’Iran et Oman. Quand la guerre en Iran a étranglé cette route en 2026, les prix ont connu leur plus forte hausse mensuelle jamais enregistrée. Depuis, les signes de paix font baisser les prix et les nouvelles attaques les font remonter.","Decides which ships may pass Hormuz and targets those that sail without its permission.":"Décide quels navires peuvent franchir Ormuz et vise ceux qui naviguent sans son autorisation.","Escorts tankers through the strait.":"Escorte des pétroliers dans le détroit.","Their crude must pass Hormuz. Exports have recovered close to pre-war levels.":"Leur brut doit passer par Ormuz. Les exportations sont revenues près de leurs niveaux d’avant-guerre.","Now price oil on diplomacy headlines as much as on supply.":"Fixent désormais le prix du pétrole autant sur les annonces diplomatiques que sur l’offre.","27 Feb 2026":"27 févr. 2026","The day before the war, Brent trades around $72 a barrel.":"La veille de la guerre, le Brent s’échange autour de 72 dollars le baril.","Mar 2026":"mars 2026","War and the Hormuz closure: Brent nears $120 at its peak and has its biggest monthly rise on record.":"Guerre et fermeture d’Ormuz : le Brent approche 120 dollars à son plus haut et enregistre sa plus forte hausse mensuelle jamais vue.","The World Bank calls it the largest oil market shock in history.":"La Banque mondiale parle du plus grand choc de l’histoire du marché pétrolier.","US forces escort tankers through Hormuz; Gulf exports recover towards pre-war levels.":"Les forces américaines escortent des pétroliers à Ormuz ; les exportations du Golfe remontent vers leurs niveaux d’avant-guerre.","A record 37 ships are attacked around Hormuz in a single month.":"Un record de 37 navires attaqués autour d’Ormuz en un seul mois.","3 Nov 2026":"3 nov. 2026","4 Nov 2026":"4 nov. 2026","Prices drop 8% in a day after the US midterms.":"Les prix chutent de 8 % en une journée après les élections américaines de mi-mandat.","Weekly loss of about 14–15%; crude falls below $100.":"Perte hebdomadaire d’environ 14 à 15 % ; le brut passe sous les 100 dollars.","Brent falls to a two-month low and settles at $91.49, after US officials play down the need for more military action.":"Le Brent tombe à son plus bas depuis deux mois et clôture à 91,49 dollars, après que des responsables américains ont minimisé la nécessité de nouvelles opérations militaires.","Brent rebounds about 1% to around $92 as attacks on ships continue. It is still about 47% higher than a year ago.":"Le Brent rebondit d’environ 1 %, à environ 92 dollars, alors que les attaques contre des navires continuent. Il reste environ 47 % plus cher qu’il y a un an.","Democrats win control of both chambers of Congress":"Les démocrates prennent le contrôle des deux chambres du Congrès","The midterms end Republican control of the White House, Senate and House. Democrats flipped seven Senate seats.":"Les élections de mi-mandat mettent fin au contrôle républicain de la Maison-Blanche, du Sénat et de la Chambre. Les démocrates ont fait basculer sept sièges au Sénat.","With divided government, President Trump’s agenda now needs Democratic votes. Congress can block nominations, launch investigations and shape budgets, which affects policy from trade to the Fed.":"Avec un pouvoir partagé, le programme du président Trump a désormais besoin de voix démocrates. Le Congrès peut bloquer des nominations, lancer des enquêtes et peser sur les budgets, ce qui touche la politique, du commerce à la Fed.","Midterms often go against the president’s party: between 1934 and 2018 it lost an average of 28 House seats.":"Les élections de mi-mandat tournent souvent au désavantage du parti du président : entre 1934 et 2018, il a perdu en moyenne 28 sièges à la Chambre.","Cost of living and inflation were central issues in the campaign.":"Le coût de la vie et l’inflation étaient au cœur de la campagne.","Before the vote, Republicans held the White House, the Senate and the House.":"Avant le vote, les républicains détenaient la Maison-Blanche, le Sénat et la Chambre.","Democrats won control of both the House and the Senate on 3 November.":"Les démocrates ont pris le contrôle de la Chambre et du Sénat le 3 novembre.","They flipped seven Senate seats: North Carolina, South Carolina, Ohio, Texas, Kansas, Iowa and Maine.":"Ils ont fait basculer sept sièges au Sénat : Caroline du Nord, Caroline du Sud, Ohio, Texas, Kansas, Iowa et Maine.","Democrats hold at least 54 Senate seats; by Thursday the count showed 240 House seats for them.":"Les démocrates détiennent au moins 54 sièges au Sénat ; jeudi, le décompte leur donnait 240 sièges à la Chambre.","It is the first time since 2023 that Democrats fully control Congress.":"C’est la première fois depuis 2023 que les démocrates contrôlent entièrement le Congrès.","Democrats control both chambers":"Les démocrates contrôlent les deux chambres","Trump’s bills need their support; gridlock becomes more likely":"Les projets de loi de Trump ont besoin de leur soutien ; le blocage devient plus probable","The Senate can block judges and nominees":"Le Sénat peut bloquer des juges et des candidats aux postes clés","More oversight and investigations of the administration":"Plus de contrôle et d’enquêtes sur l’administration","In Trump’s first term, Democrats win the House in the midterms.":"Pendant le premier mandat de Trump, les démocrates remportent la Chambre aux élections de mi-mandat.","Republicans win the White House and both chambers.":"Les républicains remportent la Maison-Blanche et les deux chambres.","The Fed raises rates as inflation stays high; cost of living dominates the campaign.":"La Fed relève ses taux alors que l’inflation reste élevée ; le coût de la vie domine la campagne.","Democrats win both chambers.":"Les démocrates remportent les deux chambres.","The president’s party usually loses ground in midterms. This time the swing also flipped the Senate, which is much rarer.":"Le parti du président perd généralement du terrain aux élections de mi-mandat. Cette fois, le basculement a aussi touché le Sénat, ce qui est beaucoup plus rare.","Frames the result as the start of a new era of divided government with deeper friction between Trump and Congress, driven by a cost-of-living message.":"Présente le résultat comme le début d’une nouvelle ère de pouvoir partagé, avec des frictions plus fortes entre Trump et le Congrès, portée par un message sur le coût de la vie.","Speaks of a “blistering rebuke” to Trump, but also reports that he said he is willing to accept the results and work with Democrats.":"Parle d’un « désaveu cinglant » pour Trump, mais rapporte aussi qu’il s’est dit prêt à accepter les résultats et à travailler avec les démocrates.","Calls it a “historic blue wave” and focuses on the Republican post-mortem: several party leaders, including Vice President Vance, blamed the Iran war, and Senator Ted Cruz said the party ignored the cost of living.":"Parle d’une « vague bleue historique » et se concentre sur l’examen de conscience républicain : plusieurs dirigeants du parti, dont le vice-président Vance, ont mis en cause la guerre en Iran, et le sénateur Ted Cruz a dit que le parti avait ignoré le coût de la vie.","Republican leadership":"Direction républicaine","Senate Republican leader John Thune vowed that Republicans “will not stand idly by” as Democrats try to undo their record on the border and tax cuts.":"Le chef des républicains au Sénat, John Thune, a promis que les républicains « ne resteront pas les bras croisés » pendant que les démocrates tentent de défaire leur bilan sur la frontière et les baisses d’impôts.","Oil fell 8% the day after the vote.":"Le pétrole a chuté de 8 % le lendemain du vote.","Republican leaders blamed the Iran war for the losses.":"Les dirigeants républicains ont attribué leurs pertes à la guerre en Iran.","A Democratic Congress means stronger oversight, including over the Fed.":"Un Congrès démocrate signifie un contrôle renforcé, y compris sur la Fed.","Gridlock":"Blocage","Few major laws pass; more investigations and blocked nominations.":"Peu de grandes lois adoptées ; plus d’enquêtes et de nominations bloquées.","More policy uncertainty in Washington.":"Plus d’incertitude politique à Washington.","Targeted deals":"Accords ciblés","Agreements on specific cost-of-living measures.":"Des accords sur des mesures précises concernant le coût de la vie.","Moves in the sectors concerned.":"Des mouvements dans les secteurs concernés.","Broad cooperation":"Large coopération","A wide bipartisan agenda before 2028.":"Un vaste programme commun aux deux partis avant 2028.","Lower policy uncertainty.":"Moins d’incertitude politique.","Final results in the remaining races":"Les résultats définitifs des scrutins encore en cours","Who leads key committees in January":"Qui présidera les commissions clés en janvier","The first budget negotiations with the White House":"Les premières négociations budgétaires avec la Maison-Blanche","−8% the day after the vote":"−8 % le lendemain du vote","US policy uncertainty":"Incertitude politique aux États-Unis","Divided government makes laws harder to pass":"Avec un pouvoir partagé, les lois sont plus difficiles à adopter","Major new laws become harder to pass, so regulatory changes slow down.":"Les grandes lois deviennent plus difficiles à adopter, donc les changements de réglementation ralentissent.","Companies in sectors under scrutiny may face congressional hearings.":"Les entreprises des secteurs sous surveillance pourraient être convoquées à des auditions au Congrès.","Budget negotiations could affect government contracts.":"Les négociations budgétaires pourraient toucher les contrats publics.","Midterms":"Élections de mi-mandat","US elections held halfway through a president’s four-year term, for all House seats and about a third of the Senate.":"Élections américaines organisées à mi-parcours du mandat de quatre ans du président, pour tous les sièges de la Chambre et environ un tiers du Sénat.","Divided government":"Pouvoir partagé","When the president’s party does not control Congress.":"Quand le parti du président ne contrôle pas le Congrès.","Confirmation":"Confirmation","The Senate’s vote to approve judges, ministers and other senior officials chosen by the president.":"Le vote du Sénat pour approuver les juges, les ministres et les autres hauts responsables choisis par le président.","Americans vote for Congress halfway through a president’s term. This time voters gave both parts of Congress to the Democrats. President Trump now needs their votes to pass laws, a bit like a CEO who has lost control of the board.":"Les Américains élisent le Congrès à mi-parcours du mandat du président. Cette fois, les électeurs ont donné les deux chambres du Congrès aux démocrates. Le président Trump a maintenant besoin de leurs voix pour faire adopter des lois, un peu comme un PDG qui a perdu le contrôle de son conseil d’administration.","How many Senate seats did Democrats flip in the midterms?":"Combien de sièges au Sénat les démocrates ont-ils fait basculer aux élections de mi-mandat ?","They flipped seven: North Carolina, South Carolina, Ohio, Texas, Kansas, Iowa and Maine.":"Ils en ont fait basculer sept : Caroline du Nord, Caroline du Sud, Ohio, Texas, Kansas, Iowa et Maine.","Which outlet, rated Lean Right by AllSides, focused on Republicans blaming the Iran war for their losses?":"Quel média, classé « Lean Right » (plutôt à droite) par AllSides, a mis l’accent sur les républicains qui attribuent leurs pertes à la guerre en Iran ?","NPR":"NPR","Washington Examiner":"Washington Examiner","The New York Times":"The New York Times","Al Jazeera":"Al Jazeera","The Washington Examiner, rated Lean Right, highlighted the Republican post-mortem.":"Le Washington Examiner, classé plutôt à droite, a mis en avant l’examen de conscience républicain.","Halfway through a president’s four-year term, Americans elect the whole House and about a third of the Senate. These midterms usually go against the president’s party. In 2024 Republicans won the White House and both chambers; on 3 November 2026 Democrats won both chambers back. The new Congress only starts on 3 January, so the outgoing one is still voting until then.":"À mi-parcours du mandat de quatre ans du président, les Américains élisent toute la Chambre et environ un tiers du Sénat. Ces élections de mi-mandat tournent généralement au désavantage du parti du président. En 2024, les républicains ont remporté la Maison-Blanche et les deux chambres ; le 3 novembre 2026, les démocrates ont repris les deux chambres. Le nouveau Congrès ne commence que le 3 janvier : le Congrès sortant continue donc de voter jusque-là.","President. His party has lost control of Congress.":"Président. Son parti a perdu le contrôle du Congrès.","Senate Republican leader. Vows to defend his party’s record on the border and tax cuts.":"Chef des républicains au Sénat. Il promet de défendre le bilan de son parti sur la frontière et les baisses d’impôts.","Vice president. Among the Republicans who blamed the Iran war for the losses.":"Vice-président. Il fait partie des républicains qui ont attribué les pertes à la guerre en Iran.","Republican rebel. Led the push to impeach Defense Secretary Hegseth and the Epstein files petitions.":"Républicain frondeur. Il a mené l’offensive ter two hikes this year. Christine Lagarde will step down on 7 February 2027, about nine months before her term ends.":"La BCE a fait une pause après deux hausses cette année. Christine Lagarde quittera ses fonctions le 7 février 2027, environ neuf mois avant la fin de son mandat.","ECB rates set the cost of mortgages and business loans across the euro area. A new president in 2027 could change the bank’s direction.":"Les taux de la BCE déterminent le coût des crédits immobiliers et des prêts aux entreprises dans toute la zone euro. Un nouveau président en 2027 pourrait changer l’orientation de la banque.","The ECB raised rates in June and September 2026, taking the deposit rate to 2.50%.":"La BCE a relevé ses taux en juin et en septembre 2026, portant le taux de dépôt à 2,50 %.","Euro area inflation was 3.2% in August, well above the 2% target, pushed up by energy prices from the Middle East conflict.":"L’inflation de la zone euro était de 3,2 % en août, bien au-dessus de l’objectif de 2 %, poussée par les prix de l’énergie liés au conflit au Moyen-Orient.","On 29 October the ECB kept its three key rates unchanged: deposit 2.50%, main refinancing 2.65%, marginal lending 2.90%.":"Le 29 octobre, la BCE a laissé ses trois taux directeurs inchangés : dépôt 2,50 %, refinancement 2,65 %, prêt marginal 2,90 %.","It will keep deciding meeting by meeting, without committing to a path.":"Elle continuera de décider réunion après réunion, sans s’engager sur une trajectoire.","The same day, Christine Lagarde announced she will step down on 7 February 2027, about nine months before her term ends.":"Le même jour, Christine Lagarde a annoncé qu’elle quittera ses fonctions le 7 février 2027, environ neuf mois avant la fin de son mandat.","EU leaders will appoint her successor. The timing lets them decide before France’s presidential election in April 2027.":"Les dirigeants de l’UE nommeront son successeur. Ce calendrier leur permet de décider avant l’élection présidentielle françai /* Merge context into stories: new sources are appended after each story's own, and string references become numbers. */
(function(){
  SEED.forEach(s => {
    const c = CTX[s.id]; if(!c) return;
    const idx = {};
    c.src.forEach(x => { idx[x.k] = s.sources.length + 1; s.sources.push({n:x.n, tier:x.tier, t:x.t, u:x.u}); });
    const fix = a => (a || []).map(v => typeof v === "number" ? v : idx[v]);
    s.ctx = {
      intro:c.intro, is:fix(c.is),
      players:c.players.map(p => ({n:p.n, r:p.r, s:fix(p.s)})),
      tl:c.tl.map(e => Object.assign({}, e, {s:fix(e.s)}))
    };
  });
})();

function shrink(file){   // resize to at most 1600 px wide and re-encode as JPEG, so pictures stay light
  return new Promise((ok, no) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1600 / img.naturalWidth), c = document.createElement("canvas");
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? ok(b) : no(new Error("encode")), "image/jpeg", 0.84);
    };
    img.onerror = () => { URL.revokeObjectURL(url); no(new Error("image")); };
    img.src = url;
  });
}

  const msgs = root.querySelector(".msgs"), sugg = root.querySelector(".sugg"), form = root.querySelector("form"), input = root.querySelector("input");
  let history = [], busy = false;
  const add = (role, text, html) => { const d = document.createElement("div"); d.className = "msg " + (role === "user" ? "user" : "ai"); d.innerHTML = html ? text : fmt(text); msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight; return d; };
  const renderSugg = () => { sugg.innerHTML = getSuggestions().map(q => `<button type="button" class="chip">${esc(q)}</button>`).join(""); };
  sugg.onclick = e => { const b = e.target.closest("button"); if(b) send(b.textContent); };
  form.onsubmit = e => { e.preventDefault(); const q = input.value.trim(); if(q){ input.value = ""; send(q); } };
  async function send(q){
    if(busy) return;
    busy = true; sugg.innerHTML = "";
    add("user", q);
    const el = add("ai", tr("thinking")); el.classList.add("pending");
    const smp = await getSampler();
    if(!smp){ el.classList.remove("pending"); el.innerHTML = fmt(tr("chatNA")); busy = false; renderSugg(); return; }
    const ctx = getContext();
    const convo = history.map((m,i) => ({role:m.role, content: i === 0 ? ctx + "\n\nQUESTION: " + m.content : m.content}));
    convo.push({role:"user", content: history.length === 0 ? ctx + "\n\nQUESTION: " + q : q});
    try{
      const res = await smp(convo, {cache:false, onText: ({text}) => { if(text){ el.classList.remove("pending"); el.innerHTML = fmt(text); msgs.scrollTop = msgs.scrollHeight; } }});
      const text = (res && res.text) ? res.text : el.textContent;
      el.classList.remove("pending"); el.innerHTML = fmt(text);
      history.push({role:"user", content:q}, {role:"assistant", content:text});
    }catch(err){
      el.classList.remove("pending");
      const code = err && err.code;
      el.innerHTML = fmt(code === "not_granted" ? tr("chatOff") : code === "rate_limited" ? tr("chatRate") : tr("chatErr"));
    }
    busy = false; renderSugg(); msgs.scrollTop = msgs.scrollHeight;
  }
  return { reset(){ history = []; msgs.innerHTML = ""; add("ai", `<p>${intro()}</p>`, true); renderSugg(); } };
}
